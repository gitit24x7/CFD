<!doctype html><html data-theme="light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ground Up Computing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* LAYOUT: sticky chapter rail on the left, one reading column + live demo panels on the right; rail becomes a drawer on phones. */
:root{
  --bg:#f2f6f7; --surface:#ffffff; --surface2:#e6eef0; --ink:#12202a; --ink2:#47596a; --line:#ccd8de;
  --accent:#0a7872; --accent-ink:#ffffff; --signal:#b86a00; --signal-bg:#fff1d8;
  --good:#1b7a3d; --good-bg:#dcf3e4; --bad:#b3261e; --bad-bg:#fde3e0; --code:#e9f0f2; --shadow:0 1px 0 rgba(18,32,42,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1216; --surface:#121c22; --surface2:#1a2830; --ink:#e3edf0; --ink2:#93a8b3; --line:#27394350;
  --line:#2a3b45; --accent:#38c4b6; --accent-ink:#04201d; --signal:#f2a640; --signal-bg:#3a2a0c;
  --good:#52d283; --good-bg:#12301f; --bad:#ff8077; --bad-bg:#3a1714; --code:#0f1a20; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1216; --surface:#121c22; --surface2:#1a2830; --ink:#e3edf0; --ink2:#93a8b3; --line:#2a3b45;
  --accent:#38c4b6; --accent-ink:#04201d; --signal:#f2a640; --signal-bg:#3a2a0c;
  --good:#52d283; --good-bg:#12301f; --bad:#ff8077; --bad-bg:#3a1714; --code:#0f1a20; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);margin:0;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
code,.mono{font-family:var(--f-mono);font-size:.9em}
code{background:var(--code);padding:.1em .35em;border-radius:4px}
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);padding:20px 16px 40px;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.brand b{font:800 1.5rem var(--f-display);letter-spacing:-.02em}
.brand span{font:500 .72rem var(--f-mono);color:var(--ink2)}
.tag{font-size:.8rem;color:var(--ink2);margin:0 0 16px}
.rail h4{font:600 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:20px 0 6px}
.rail a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.92rem;line-height:1.3}
.rail a:hover{background:var(--surface2)}
.rail a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.rail a i{font:normal .7rem var(--f-mono);width:1.1em;color:var(--good);flex:none}
.rail a[aria-current="page"] i{color:var(--accent-ink)}
.rail .meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:8px 0 0}
.rail .meter div{height:100%;background:var(--accent)}
.rail small{color:var(--ink2);font-size:.75rem}
.topbar{display:none}
.main{padding:32px 32px 80px;min-width:0}
.col{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.crumb{font:500 .75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.word{font:800 clamp(3rem,10vw,6.2rem)/.95 var(--f-display);letter-spacing:-.035em;color:var(--accent);margin:6px 0 10px}
.ctitle{font:600 1.35rem var(--f-display);color:var(--ink2)}
.plain{font-size:1.2rem;line-height:1.5;border-left:4px solid var(--signal);padding:2px 0 2px 16px;margin:0}
.plain small{display:block;font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:var(--shadow);min-width:0}
.tr{width:100%;border-collapse:collapse;font-size:.92rem}
.tr th{font:600 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:0 10px 8px 0}
.tr td{padding:10px 12px 10px 0;border-top:1px solid var(--line);vertical-align:top}
.tr td:first-child{color:var(--ink2);font-family:var(--f-mono);font-size:.82rem;width:46%}
.tr td:last-child{font-weight:500}
.scroll{overflow-x:auto}
.sec{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 24px}
.sec>h3{font:600 .75rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding-top:6px}
.sec>div{display:flex;flex-direction:column;gap:12px;max-width:68ch;min-width:0}
.sec p,.sec li{margin:0}
.sec ul,.sec ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.sec.trap>h3{color:var(--bad)}
.term{background:none;border:0;border-bottom:2px dotted var(--accent);padding:0;cursor:pointer;color:inherit;font:inherit}
.term:hover,.term[aria-expanded="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.defbox{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:.93rem;margin:4px 0 4px 0}
.defbox b{font-family:var(--f-display);font-size:1rem}
.defbox .defbox{background:var(--surface)}
.demo{border:2px solid var(--accent);border-radius:12px;background:var(--surface);overflow:hidden}
.demo>header{background:var(--accent);color:var(--accent-ink);padding:8px 16px;font:600 .75rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.demo-body{padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.demo-note{margin:0;color:var(--ink2);font-size:.92rem}
.demo h5{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bit{width:3rem;height:3.4rem;border-radius:8px;border:2px solid var(--line);background:var(--surface2);font:500 1.4rem var(--f-mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:4px;padding:0}
.bit small{font-size:.6rem;color:var(--ink2)}
.bit.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bit.on small{color:var(--accent-ink)}
.out{font:500 1.05rem var(--f-mono);background:var(--code);border-radius:6px;padding:8px 12px;overflow-x:auto;white-space:pre}
.pill{display:inline-block;font:500 .75rem var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.sig{background:var(--signal-bg);color:var(--signal);border-color:transparent}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbl{border-collapse:collapse;font:.85rem var(--f-mono);width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.tbl th{background:var(--surface2);font-weight:600}
.tbl tr.hl td{background:var(--signal-bg);color:var(--signal);font-weight:600}
.tbl td.hl{background:var(--signal-bg);color:var(--signal)}
.reg{border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:92px;background:var(--surface)}
.reg b{display:block;font:600 .68rem var(--f-mono);color:var(--ink2);letter-spacing:.06em}
.reg span{font:500 1.15rem var(--f-mono)}
.reg.hl{border-color:var(--signal);background:var(--signal-bg)}
.log{font:.82rem/1.5 var(--f-mono);background:var(--code);border-radius:6px;padding:10px 12px;max-height:200px;overflow:auto}
.log div{padding:1px 0}
.msg{padding:10px 14px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:.93rem}
.msg.good{background:var(--good-bg);border-color:transparent}
.msg.bad{background:var(--bad-bg);border-color:transparent}
.msg.sig{background:var(--signal-bg);border-color:transparent}
.bar{height:22px;border-radius:4px;background:var(--accent);min-width:3px}
.bars{display:grid;grid-template-columns:minmax(80px,max-content) minmax(0,1fr) minmax(70px,max-content);gap:6px 10px;align-items:center;font:.82rem var(--f-mono)}
.nodes{display:flex;flex-wrap:wrap;gap:8px}
.node{border:2px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.85rem;background:var(--surface2);color:var(--ink2);transition:all .2s}
.node.lit{border-color:var(--signal);background:var(--signal-bg);color:var(--signal)}
.node.dead{border-style:dashed;border-color:var(--bad);color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.step{border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.step h5{margin:0 0 4px;color:var(--accent)}
.step p{margin:0}
.blocks{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.blk{aspect-ratio:1;border-radius:3px;background:var(--surface2);font:.6rem var(--f-mono);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.seq{display:grid;grid-template-columns:1fr 1fr;gap:0;font-size:.85rem}
.seq .head{font:600 .8rem var(--f-mono);text-align:center;padding:6px;background:var(--surface2);border:1px solid var(--line)}
.seq .l,.seq .r{padding:6px 8px;border-bottom:1px dashed var(--line);min-height:2.2em;font:.78rem var(--f-mono)}
.seq .l{text-align:left;border-left:1px solid var(--line)}
.seq .r{text-align:right;border-right:1px solid var(--line)}
.seq .act{color:var(--signal);font-weight:600}
.seq .dim{opacity:.35}
.quiz .opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.quiz .opts .btn{text-align:left}
.quiz .opts .btn.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.quiz .opts .btn.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager a{flex:1 1 220px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font:500 .7rem var(--f-mono);color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.pager a.next{text-align:right}
.stack{display:flex;flex-direction:column-reverse;gap:6px}
.stack a{display:flex;gap:14px;align-items:baseline;padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.stack a:hover{border-color:var(--accent)}
.stack b{font:800 1.3rem var(--f-display);color:var(--accent);min-width:7.5ch}
.stack span{color:var(--ink2);font-size:.92rem}
.hero h1{font:800 clamp(2.6rem,8vw,5rem)/.98 var(--f-display);letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:1.15rem;max-width:60ch}
input[type=text],input[type=number],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
input[type=range]{accent-color:var(--accent);max-width:100%}
.gl dt{font:700 1.05rem var(--f-display);margin-top:16px}
.gl dd{margin:2px 0 0;color:var(--ink2);max-width:70ch}
.tl{display:flex;flex-direction:column;gap:0}
.tl button{display:grid;grid-template-columns:5.5ch minmax(0,1fr);gap:12px;text-align:left;background:none;border:0;border-left:3px solid var(--line);padding:8px 10px;cursor:pointer;margin-left:6px}
.tl button b{font:500 .85rem var(--f-mono);color:var(--ink2)}
.tl button[aria-pressed="true"]{border-left-color:var(--signal);background:var(--signal-bg)}
.sig-on{stroke:var(--signal)} 
svg text{fill:var(--ink);font:12px var(--f-mono)}
svg .w{stroke:var(--ink2);stroke-width:2.5;fill:none}
svg .w.on{stroke:var(--signal)}
svg .bx{fill:var(--surface2);stroke:var(--ink2);stroke-width:2}
svg .bx.on{fill:var(--signal-bg);stroke:var(--signal)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:20;transform:translateX(-100%);transition:transform .2s;height:100%}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;gap:12px;align-items:center;justify-content:space-between}
  .topbar b{font:800 1.2rem var(--f-display)}
  .main{padding:20px 16px 64px}
  .sec{grid-template-columns:minmax(0,1fr)}
  .tr td:first-child{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.chlink{color:var(--accent);font-weight:600;text-decoration:underline}
/* picture book */
.fig{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.fig>header{padding:16px 20px 0}
.fig>header h2{font:800 1.5rem var(--f-display);letter-spacing:-.02em}
.fig>header p{margin:4px 0 0;color:var(--ink2);max-width:62ch}
.fig .fb{padding:14px 20px 8px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fig figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.fig figcaption{font-size:.88rem;color:var(--ink2);max-width:70ch}
.fig svg{width:100%;height:auto;color:var(--ink);display:block;overflow:visible}
.fig svg text{font:12px var(--f-mono);fill:currentColor}
.fig svg .big{font:700 15px var(--f-display)}
.fig svg .sm{font-size:10.5px;fill:var(--ink2)}
.fig svg .s-line{stroke:currentColor;stroke-width:2;fill:none}
.fig svg .s-thin{stroke:var(--line);stroke-width:2;fill:none}
.fig svg .s-fill{fill:var(--surface2);stroke:currentColor;stroke-width:2}
.fig svg .s-acc{fill:var(--accent);stroke:none}
.fig svg .s-sig{fill:var(--signal);stroke:none}
.fig svg .s-bad{fill:var(--bad);stroke:none}
.fig svg .s-good{fill:var(--good);stroke:none}
.fig svg .s-ring{fill:none;stroke:var(--accent);stroke-width:6}
.fig svg .lit{fill:var(--signal-bg);stroke:var(--signal);stroke-width:2}
.fig svg .tag{fill:var(--ink2);font-size:11px}
.fig svg .hit{cursor:pointer}
.fig svg .hit:hover{opacity:.8}
.fig .fl{padding:10px 20px 16px;font-size:.85rem}
.gal-toc{display:flex;flex-wrap:wrap;gap:8px}
.gal-toc a{border:1px solid var(--line);border-radius:99px;padding:5px 12px;text-decoration:none;color:var(--ink);background:var(--surface);font-size:.88rem}
.gal-toc a:hover{border-color:var(--accent)}
/* workshop */
.col.wide{max-width:1120px}
.ws-title{font:800 clamp(2.4rem,7vw,4.4rem)/1 var(--f-display);color:var(--accent);letter-spacing:-.03em}
.ws-tabs{display:flex;flex-wrap:wrap;gap:6px}
.ws-tabs a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink);background:var(--surface);font-size:.9rem}
.ws-tabs a.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ws-ck{font:600 .72rem var(--f-mono);color:var(--ink2)}.ws-ck.ok{color:var(--good)}.ws-tabs a.cur .ws-ck{color:var(--bg)}
.ws-tree{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.ws-node{flex:1 1 150px;max-width:210px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.ws-node:hover{border-color:var(--accent)}.ws-node.done{border-color:var(--good)}
.ws-node small{color:var(--ink2);font-size:.8rem;line-height:1.35}
.ws-n{font:700 .8rem var(--f-mono);color:var(--accent)}.ws-node.done .ws-n{color:var(--good)}
.ws-arrow{align-self:center;color:var(--ink2)}
.wb{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.wb-side h5{margin:0 0 8px;font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.wb-side small{text-transform:none;letter-spacing:0;font-weight:400}
.wb-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);align-self:start}
.wb-tray{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 110px);overflow:auto;padding:8px;border:1px dashed var(--line);border-radius:10px;min-height:80px;background:var(--bg)}
.wb-board{display:grid;gap:10px}
.wb-slot{border:2px dashed var(--line);border-radius:10px;background:var(--surface2);padding:10px;min-height:104px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,background .15s}
.wb-slot.full{border-style:solid;border-color:var(--accent);background:var(--surface)}
.wb-slot.over{border-color:var(--signal);background:var(--signal-bg)}
.wb-slot.lit{border-style:solid;border-color:var(--signal);background:var(--signal-bg)}
.wb-slot.dead{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.wb-slot.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wb-label b{font-size:.88rem}.wb-need{color:var(--ink2);font-size:.78rem;line-height:1.35}
.wb-part{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;gap:2px;min-width:0}
.wb-part b{font-size:.88rem;line-height:1.25}.wb-part small{color:var(--ink2);font-size:.76rem;line-height:1.3}
.wb-part:hover{border-color:var(--accent)}.wb-part.sel{outline:3px solid var(--signal);outline-offset:1px}.wb-part.dragging{opacity:.3}
.wb-part.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:grabbing}
.wb-x{align-self:flex-start;background:none;border:0;color:var(--ink2);font-size:.75rem;text-decoration:underline;cursor:pointer;padding:0}
.lab-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.lab-wrap svg{display:block;width:100%;min-width:720px;height:auto;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.lab svg text{font:12px var(--f-mono);fill:currentColor;pointer-events:none}
.lab svg .lt.b{font-weight:700}.lab svg .lt.sm{font-size:10.5px;fill:var(--ink2)}.lab svg .lt.big2{font-size:15px;font-weight:700}
.lab svg .lp{fill:var(--surface2);stroke:currentColor;stroke-width:2;cursor:grab}
.lab svg .lp.on{fill:var(--signal-bg);stroke:var(--signal)}
.lab svg .lp.sel{stroke:var(--signal);stroke-width:4}

<script>
const G = {
'abstraction':['Abstraction','Hiding the inner detail of a thing behind a simple surface, so you can use it without knowing how it works. A car pedal is an abstraction over the engine.'],
'acid':['ACID','Four promises a database makes about a [[transaction]]: Atomicity (all or nothing), Consistency (rules stay true), Isolation (people do not see each other\'s half-finished work), Durability (once confirmed, it survives a crash).'],
'address':['Address','A number that names one location in memory, like a house number on a very long street. Memory location 0 is the first, 1 is the next, and so on.'],
'algorithm':['Algorithm','A precise list of steps that solves a problem. A recipe is an algorithm for food.'],
'alu':['ALU','Arithmetic Logic Unit. The circuit inside the [[cpu]] that does the actual adding, subtracting, comparing, AND/OR work.'],
'analog':['Analog','A signal that can take any value in a continuous range, like a dimmer switch. Small disturbances change the value and cannot be told apart from the real signal.'],
'application-layer':['Application layer','The top network layer, where programs like web browsers and email apps speak their own language (for example [[http]]).'],
'assembly':['Assembly language','Machine code written with short readable names (ADD, LOAD) instead of raw numbers. One assembly line usually becomes exactly one machine instruction.'],
'atomic':['Atomic','Impossible to split. An atomic operation either happens completely or not at all, and no one can see it half-done.'],
'audit-log':['Audit log','An append-only record of who did what and when. Entries are added, never edited, so history can be checked later.'],
'bandwidth':['Bandwidth','How much data can be moved per second. A wide pipe moves more water per second, even if the water takes the same time to arrive.'],
'big-o':['Big-O','A way to describe how the number of steps grows as the input grows. O(n) means steps grow in line with the input size n. O(log n) means each doubling of the input adds only one step.'],
'binary':['Binary','Counting with only two symbols, 0 and 1. Each position is worth double the one to its right: 1, 2, 4, 8, 16 and so on.'],
'bit':['Bit','Short for binary digit. One bit holds one of two possibilities, written 0 or 1.'],
'block':['Block','A fixed-size chunk of storage, such as 4096 bytes. Storage devices read and write whole blocks, not single bytes.'],
'boolean':['Boolean logic','The mathematics of true and false, with the operations AND, OR and NOT. Invented by George Boole in the 1800s, long before computers.'],
'branch':['Branch / jump','An instruction that changes the [[program-counter]] so the CPU continues somewhere other than the next line. It is how "if" and loops work at the lowest level.'],
'bus':['Bus','A set of shared wires that carries data, addresses or control signals between parts of a computer.'],
'byte':['Byte','A group of 8 [[bit]]s. It has 256 possible patterns (2 multiplied by itself 8 times) and is the usual unit for measuring memory.'],
'cache':['Cache','A small, fast copy of data kept close to where it is needed, so the slow original does not have to be asked every time.'],
'cache-line':['Cache line','The chunk a cache moves at a time, commonly 64 bytes. Asking for one byte brings its neighbours along, betting you will want them next.'],
'capacitor':['Capacitor','A part that stores a small amount of electric charge, like a tiny bucket. Charged can mean 1, empty can mean 0. The charge leaks away over time.'],
'carry':['Carry','The digit passed to the next column when a column overflows, exactly as in 9 + 1 = 10 where the 1 is carried.'],
'cdn':['CDN','Content Delivery Network. A set of servers around the world holding copies of popular files, so you download from one near you.'],
'clock':['Clock','A steady on-off pulse sent to every part of a chip so they all change state at the same moments.'],
'compiler':['Compiler','A program that translates a whole program written in a high-level language into [[machine-code]] before it runs.'],
'concurrency':['Concurrency','Several tasks in progress during the same period, either truly at once on different [[core]]s or by taking quick turns.'],
'context-switch':['Context switch','Saving everything about one running program (its registers, where it was), then loading the same for another, so the second can continue where it left off.'],
'core':['Core','One complete processing unit inside a chip. A chip with four cores can run four instruction streams truly at the same time.'],
'cpu':['CPU','Central Processing Unit. The chip part that fetches instructions and carries them out.'],
'cryptography':['Cryptography','Math techniques for keeping information secret, detecting changes, and proving who sent something.'],
'current':['Electric current','A flow of electric charge through a wire. Like water flowing in a pipe.'],
'data-center':['Data center','A building full of server computers with power backup, cooling and fast network links.'],
'database':['Database','Software that stores structured data and answers questions about it, while keeping it safe from crashes and from conflicting edits.'],
'deadlock':['Deadlock','Two tasks each hold something the other needs and both wait forever. Like two cars each blocking the other on a narrow bridge.'],
'decode':['Decode','Working out what an instruction means by looking at its bit pattern: which operation, on what.'],
'dns':['DNS','Domain Name System. The internet\'s phone book: it turns a name like example.com into a numeric [[ip-address]].'],
'doping':['Doping','Adding a tiny amount of another element to pure silicon to change how well it conducts. This is how chip makers create the regions of a [[transistor]].'],
'dram':['DRAM','Dynamic RAM. Memory where each bit is one [[transistor]] plus one [[capacitor]]. Dense and cheap, but the charge leaks, so it must be refreshed many times per second.'],
'driver':['Device driver','Software that knows the exact details of one piece of hardware and presents it to the OS in a standard way.'],
'durability':['Durability','The promise that once a database says "saved", the data survives a crash or power loss, because it was written to [[nonvolatile]] storage.'],
'electron':['Electron','A tiny particle carrying negative electric charge. A flow of electrons is what we call [[current]].'],
'encryption':['Encryption','Scrambling data with a [[key]] so only someone with the right key can unscramble it.'],
'execute':['Execute','Carrying out an instruction: doing the add, the memory write, the jump.'],
'fetch':['Fetch','Reading the next instruction from memory into the CPU.'],
'file':['File','A named collection of bytes. The name and the idea of a "file" are provided by the [[filesystem]]; the device only knows blocks.'],
'filesystem':['File system','The part of the OS that keeps a table linking each file name to the [[block]]s that hold its content.'],
'flag':['Flag','A single bit that records something about the last operation, such as "the result was zero" or "it overflowed".'],
'flash':['Flash memory','Storage made of cells that trap electric charge and keep it without power. Used in SSDs and phones.'],
'flipflop':['Flip-flop','A [[latch]] that only changes when the [[clock]] ticks. The building block of [[register]]s.'],
'frame':['Frame','A fixed-size slot of real RAM (usually 4 KB) that can hold one [[page]].'],
'gate-terminal':['Gate (of a transistor)','The control terminal of a [[transistor]]. A voltage here decides whether current can flow between the other two terminals. It is insulated, so the control costs almost no current.'],
'hash':['Hash','A fixed-length fingerprint computed from any data. The same input always gives the same fingerprint, a tiny change gives a completely different one, and you cannot work backwards from the fingerprint.'],
'hdd':['Hard disk drive','Storage using spinning magnetic platters and a moving read/write arm. Cheap per gigabyte, but the arm must physically move to the right spot.'],
'header':['Header','Labels added to the front of a [[packet]]: who it is from, who it is for, its order number.'],
'hertz':['Hertz (Hz)','Times per second. 1 GHz is one billion ticks every second.'],
'http':['HTTP','HyperText Transfer Protocol. The agreed format for a browser to ask a server for a page and for the server to answer with a status code and content.'],
'hsm':['HSM','Hardware Security Module. A tamper-resistant box that stores secret keys and does the cryptography inside, so the keys never leave it.'],
'idempotent':['Idempotent','Safe to repeat. Doing it twice has the same effect as once. "Set balance to 50" is idempotent, "subtract 10" is not.'],
'index':['Index','A sorted lookup structure kept beside the data, like the index at the back of a book, so a search does not have to read everything.'],
'instruction':['Instruction','One tiny command the CPU understands, such as "add these two numbers" or "copy this value from memory".'],
'integrated-circuit':['Integrated circuit','Many [[transistor]]s and wires made together on one piece of silicon, instead of wiring separate parts by hand. Also called a chip.'],
'interrupt':['Interrupt','A signal that makes the CPU pause what it is doing, handle an urgent event, then resume.'],
'ip-address':['IP address','A number identifying a device on a network so [[packet]]s can be routed to it, for example 93.184.216.34.'],
'isolation':['Isolation','The promise that people using a database at the same time do not see each other\'s half-finished changes.'],
'kernel':['Kernel','The core of the operating system, the part allowed to touch the hardware directly.'],
'key':['Key','A secret (or public) value used to lock and unlock data. Like the specific shape of a physical key.'],
'latch':['Latch','A circuit that holds one bit by feeding its output back into itself.'],
'latency':['Latency','The wait before something arrives. Time from asking to getting the first answer.'],
'ledger':['Ledger','A record of every money movement. Each entry is added, never erased; mistakes are fixed by adding a correcting entry.'],
'load-balancer':['Load balancer','A machine that receives all incoming requests and hands each to one of several identical servers, skipping broken ones.'],
'lock':['Lock','A flag that only one task can hold at a time. Others wait until it is released. It forces tasks to take turns on shared data.'],
'logic-gate':['Logic gate','A small circuit made of [[transistor]]s that turns input bits into one output bit by a fixed rule (AND, OR, NOT...).'],
'machine-code':['Machine code','The numeric [[instruction]]s a [[cpu]] actually runs. Everything else is translated down to this.'],
'mainframe':['Mainframe','A large, extremely reliable computer built for processing huge numbers of transactions. Many big banks still run their core record-keeping on them.'],
'memory':['Memory (RAM)','Fast working storage that holds the programs and data in use right now. It is emptied when power goes off.'],
'microprocessor':['Microprocessor','A whole [[cpu]] on a single chip. The first commercial one was the Intel 4004 in 1971.'],
'moore':['Moore\'s law','The observation (1965, revised 1975) that the number of transistors on a chip roughly doubles every two years. It is a trend, not a law of physics, and it has been slowing.'],
'nand':['NAND gate','A [[logic-gate]] that outputs 0 only when both inputs are 1. Every other gate can be built from NANDs alone.'],
'nonvolatile':['Nonvolatile','Keeps its contents with the power off.'],
'opcode':['Opcode','The part of an [[instruction]] that says which operation to do.'],
'oscillator':['Oscillator','A circuit that produces a repeating wave. In computers it is usually driven by a vibrating quartz crystal.'],
'overflow':['Overflow','A result too big to fit in the available bits. In 8 bits, 255 + 1 does not fit, so the stored result wraps to 0.'],
'packet':['Packet','A small chunk of data with a [[header]] on the front. Big messages are cut into many packets.'],
'page':['Page','A fixed-size chunk of virtual memory, usually 4 KB. The OS maps virtual pages to real [[frame]]s.'],
'page-fault':['Page fault','The CPU touched a virtual page that has no real [[frame]] right now. The OS pauses the program, loads the data, then lets it continue. Normal and frequent, not an error.'],
'page-table':['Page table','A lookup table, kept per program, saying which real [[frame]] holds each virtual [[page]].'],
'pipeline':['Pipeline','Starting the next instruction before the previous one has finished, like an assembly line. Modern CPUs do this.'],
'polling':['Polling','Repeatedly asking "has it happened yet?" Simple, but wastes effort when the answer is usually no.'],
'port':['Port','A number that picks which program on a machine should receive a [[packet]]. Web servers usually listen on port 443 (secure) or 80.'],
'process':['Process','A running program with its own private memory and its own state.'],
'program-counter':['Program counter','A [[register]] holding the memory [[address]] of the next instruction. It is the CPU\'s finger on the recipe line.'],
'protocol':['Protocol','An agreed set of rules for a conversation: what to say, in what order, in what format.'],
'public-key':['Public-key cryptography','A scheme using a pair of keys. What one key locks, only the other can unlock. You publish one and keep one secret.'],
'quantum':['Time slice','The short turn (a few milliseconds) a program is given on the CPU before the OS may switch to another.'],
'queue':['Queue','A line of jobs waiting to be done in order. It lets a fast part hand work to a slow part without waiting.'],
'race':['Race condition','A bug where the result depends on the exact timing of tasks that share data.'],
'ram':['RAM','Random Access Memory. See [[memory]]. "Random access" means any location is as quick to reach as any other.'],
'register':['Register','A tiny, very fast storage slot inside the CPU, made of [[flipflop]]s. It holds one number the CPU is using right now.'],
'relay':['Relay','A switch moved by an electromagnet. It clicks, takes milliseconds, and wears out from physical movement.'],
'replica':['Replica','A live copy of a database or server, kept so another can take over if the first fails.'],
'rollback':['Rollback','Undoing everything a [[transaction]] did so far, returning to the state before it started.'],
'router':['Router','A device that looks at each [[packet]]\'s destination and forwards it to the next closest device.'],
'salt':['Salt','Random extra text mixed into a password before [[hash]]ing, so identical passwords give different hashes.'],
'scheduler':['Scheduler','The part of the OS that decides which program gets the CPU next, and for how long.'],
'semiconductor':['Semiconductor','A material, such as silicon, that sometimes conducts electricity and sometimes does not, depending on how it is treated and what voltage is applied.'],
'signal':['Signal','A voltage on a wire that carries information.'],
'silicon':['Silicon','The element that most chips are made from. Sand is rich in it.'],
'sram':['SRAM','Static RAM. Memory where each bit is a [[latch]] of about six transistors. Faster and more expensive than [[dram]], and used for caches.'],
'ssd':['SSD','Solid State Drive. Storage made of [[flash]] chips, with no moving parts.'],
'stack':['Stack','A pile where you only add to and remove from the top. Last in, first out.'],
'stored-program':['Stored-program idea','Keep the program as numbers in the same memory as the data, so changing the program means changing memory, not rewiring.'],
'symmetric':['Symmetric encryption','Encryption where the same [[key]] locks and unlocks. Fast, but both sides must somehow share the key first.'],
'syscall':['System call','A request from a program to the OS kernel: "open this file", "send this data".'],
'tcp':['TCP','Transmission Control Protocol. Adds numbering, acknowledgements and resending on top of unreliable packets, so data arrives complete and in order.'],
'thread':['Thread','One line of execution inside a process. Threads in the same process share its memory.'],
'tls':['TLS','Transport Layer Security. The protocol behind the padlock in a browser: it proves who the server is and encrypts the conversation.'],
'token':['Token','A meaningful chunk of text found by a translator: a number, a name, a symbol like +.'],
'transaction':['Transaction','A group of changes treated as one unit: either all of them happen or none do.'],
'transistor':['Transistor','A tiny electrically controlled switch with no moving parts. See the Transistor chapter.'],
'truth-table':['Truth table','A list of every possible input combination and the output it gives.'],
'twos-complement':['Two\'s complement','The standard way to store negative whole numbers in binary. To negate a number, flip every bit and add 1. It lets the same adder do subtraction.'],
'vacuum-tube':['Vacuum tube','A glass bulb with a heated filament that controls a current flowing through empty space. Works as a switch, but is hot, large, power-hungry and burns out.'],
'virtual-memory':['Virtual memory','The illusion that each program has its own huge, private block of memory addresses, created by the OS and hardware.'],
'volatile':['Volatile','Loses its contents when power is removed.'],
'voltage':['Voltage','The electrical "pressure" pushing [[current]] through a wire, measured in volts. Like water pressure.'],
'von-neumann':['Von Neumann architecture','The design where one memory holds both instructions and data, and a CPU fetches both over the same path. Described in the 1945 EDVAC report.'],
'wire':['Wire','A path that carries a [[signal]] from one place to another.'],
'write-ahead-log':['Write-ahead log','A database writes its intention to a log on disk first, then changes the real data. After a crash, the log tells it what to finish or undo.'],
'failover':['Failover','Automatically switching to a backup when the main one fails.'],
'double-entry':['Double-entry bookkeeping','Every money movement is recorded twice: a debit in one account and an equal credit in another, so the books always add up to zero.'],
'fraud-check':['Fraud check','Software that scores a payment for risk using patterns like location, amount and history, and may decline or ask for more proof.'],
'kernel-mode':['Kernel mode','The CPU privilege level where all instructions are allowed. Only the OS kernel runs here; ordinary programs run in a restricted user mode.'],
'tlb':['TLB','Translation Lookaside Buffer. A tiny cache inside the CPU that remembers recent virtual-to-real address translations.'],
'shell':['Shell / desktop','The part of the OS you interact with (windows, icons, command line). It is a program that sits on top of the kernel.'],
'dma':['DMA','Direct Memory Access. Lets a device copy data into RAM by itself, without the CPU moving every byte.'],
'sequence-number':['Sequence number','A number stamped on each packet so the receiver can put them in order and notice which are missing.'],
'handshake':['Handshake','The opening exchange of messages where two sides agree how they will talk, before any real data is sent.'],
'ttl':['TTL','Time To Live. How long a stored answer may be reused before it must be checked again.'],
'photolithography':['Photolithography','Printing circuit patterns onto silicon using light through a stencil, repeated in many layers.'],
'mux':['Multiplexer','A circuit that picks one of several inputs to pass on, based on a selector value.'],
'locality':['Locality','The habit of programs to reuse data they just used (temporal) and to use data stored next to it (spatial). Caches depend on it.'],
'compile-time':['Just-in-time compilation','Compiling code while the program is running, focusing on the parts used most. JavaScript engines do this.'],
'ast':['Syntax tree','A tree showing how an expression is built from smaller parts, e.g. 2 + 3 * 4 is a plus whose right side is a multiplication.'],
'cmos':['CMOS','The style of chip design that pairs two kinds of transistor so that, when nothing is switching, almost no current flows. Nearly all modern chips use it.'],
};
G['udp']=['UDP','User Datagram Protocol. Sends packets with no numbering, acknowledgements or resending. Less reliable, but with no waiting, which suits live video and games.'];
G['server']=['Server','A computer whose job is to answer requests from other computers over a network.'];
G['browser']=['Browser','A program that fetches pages over HTTP and draws them on screen.'];
G['gpu']=['GPU','Graphics Processing Unit. A chip with many small cores, good at doing the same simple maths on many pixels at once.'];
G['tracing']=['Trace','Following one action step by step through every part it touches.'];
Object.assign(G,{
'branch-prediction':['Branch prediction','The CPU guessing which way a [[branch]] will go before it knows, so it can keep its [[pipeline]] full. A right guess costs nothing; a wrong one throws away the work done on the wrong path.'],
'flush':['Pipeline flush','Discarding the half-done instructions in the [[pipeline]] after a wrong guess, then starting again from the correct place.'],
'hazard':['Hazard','A situation where the next instruction cannot go ahead yet because it needs something the previous one has not finished producing.'],
'parallel':['Parallel','Many things happening at the same moment, on different hardware.'],
'simd':['Lanes (SIMD / SIMT)','Many small units that each do the same operation on a different piece of data at the same time, controlled by a single instruction.'],
'shader':['Shader','A small program run once for every pixel or vertex on screen, by many [[gpu]] units at once.'],
'journal':['Journal','A small log area where a [[filesystem]] first writes down what it is about to change. After a crash it reads the log to finish or ignore the half-done change.'],
'orphan':['Orphan block','A storage block marked as used that no file points to. The space is lost until a repair tool finds it.'],
'vm':['Virtual machine','A whole computer simulated by software, with its own operating system, running on a real machine. Several can share one physical server.'],
'hypervisor':['Hypervisor','The software that creates and runs [[vm]]s, giving each its own slice of CPU, memory and storage.'],
'container':['Container','A group of processes that the OS isolates so they see only their own files and settings, while sharing the host\'s [[kernel]]. Lighter and faster to start than a [[vm]].'],
'cloud':['Cloud','Renting computing power (servers, storage, databases) from a provider\'s [[data-center]], by the hour or second, instead of owning it.'],
'autoscaling':['Autoscaling','Automatically adding servers when demand rises and removing them when it falls, so you pay for roughly what you use.'],
'compression':['Compression','Storing data in fewer bits by removing repetition or detail. Lossless gives back the exact original; lossy does not.'],
'lossless':['Lossless','Compression that can restore every original bit (ZIP, PNG).'],
'lossy':['Lossy','Compression that throws away detail people are unlikely to notice (JPEG, MP3), so the original cannot be fully restored.'],
'prefix-free':['Prefix-free code','A set of codes where no code is the start of another, so a stream of them can be split back apart without separators.'],
