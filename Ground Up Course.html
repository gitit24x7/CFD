function wsLoad(){try{const j=JSON.parse(store('gu-ws')||'{}');if(j.done)WS.done=j.done;if(j.solved)WS.solved=j.solved;if(j.chips)WS.chips=j.chips;if(j.boardFaults)WS.boardFaults=j.boardFaults;
  PUZ.forEach(p=>{if(WS.chips[p.name])LIB[p.name]={name:p.name,ins:p.ins,outs:p.outs,design:WS.chips[p.name]}})}catch(e){}}
function wsSave(){try{store('gu-ws',JSON.stringify({done:WS.done,solved:WS.solved,chips:WS.chips,boardFaults:WS.boardFaults}))}catch(e){}}

/* ===== Slot builder engine (drag, click-to-place, power-on test) ===== */
const BUILDS={};
function mountBuild(root,B){
  const tk=ROUTE_TOKEN;
  const parts=B.parts().map(p=>({...p})),byId=Object.fromEntries(parts.map(p=>[p.id,p]));
  let placed={},sel=null,steps=[],si=0,verdict=null;
  root.innerHTML=`<div class="wb"><div><div class="wb-board" id="bd" style="grid-template-columns:repeat(${B.cols},minmax(0,1fr))"></div></div><aside class="wb-side"><h5>Parts bin <small>(drag a part onto a slot, or tap a part then a slot)</small></h5><div class="wb-tray" id="tray" data-tray="1"></div></aside></div>
  <div class="msg" id="fb" role="status">${esc(B.start||'Pick a part from the bin and put it where it belongs.')}</div>
  <div class="row"><button class="btn pri" id="run" type="button">${esc(B.runLabel||'Power on and test')}</button><button class="btn" id="rs" type="button">Start over</button><span class="pill" id="cnt"></span></div>
  <div id="res"></div>`;
  const partHtml=(p,inSlot)=>`<div class="wb-part ${sel===p.id?'sel':''}" data-part="${p.id}" tabindex="0" role="button" aria-label="${esc(p.label)}"><b>${esc(p.label)}</b><small>${esc(p.desc)}</small></div>`;
  const fb=(t,cls)=>{const f=$(root,'#fb');f.className='msg '+(cls||'');f.innerHTML=t};
  const draw=()=>{
    const usedIds=new Set(Object.values(placed));
    $(root,'#bd').innerHTML=B.slots.map(s=>{const pid=placed[s.id];return `<div class="wb-slot ${pid?'full':''} ${s.optional?'opt':''}" data-slot="${s.id}" style="grid-column:${s.col} / span ${s.cs||1};grid-row:${s.row} / span ${s.rs||1}"><div class="wb-label"><b>${esc(s.label)}</b>${s.optional?' <span class="pill">optional</span>':''}</div>${pid?partHtml(byId[pid],true)+`<button class="wb-x" type="button" data-rm="${s.id}" aria-label="Remove ${esc(byId[pid].label)}">remove</button>`:`<small class="wb-need">${esc(s.need)}</small>`}</div>`}).join('');
    $(root,'#tray').innerHTML=parts.filter(p=>!usedIds.has(p.id)).map(p=>partHtml(p)).join('')||'<small>(bin empty)</small>';
    const req=B.slots.filter(s=>!s.optional),filled=req.filter(s=>placed[s.id]).length;
    $(root,'#cnt').textContent=`required slots filled: ${filled} / ${req.length}`;
    $$(root,'[data-rm]').forEach(b=>b.onclick=()=>{delete placed[b.dataset.rm];steps=[];$(root,'#res').innerHTML='';draw()});
  };
  const flash=id=>{const e=$(root,`[data-slot="${id}"]`);if(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}};
  const place=(pid,sid)=>{
    const p=byId[pid],s=B.slots.find(x=>x.id===sid);if(!p||!s)return;
    if(!s.accepts.includes(p.kind)){draw();flash(sid);fb(`<b>Doesn't fit.</b> ${esc(p.label)}: ${esc(p.reject||p.desc)} This slot needs: ${esc(s.need)}`,'bad');sel=null;return}
    for(const k in placed)if(placed[k]===pid)delete placed[k];
    placed[sid]=pid;sel=null;steps=[];$(root,'#res').innerHTML='';draw();
    fb(`<b>${esc(p.label)}</b> fits in ${esc(s.label)}. ${esc(p.fits||'')}`,'good');
  };
  const unplace=pid=>{for(const k in placed)if(placed[k]===pid)delete placed[k];sel=null;steps=[];$(root,'#res').innerHTML='';draw()};
  /* pointer drag */
  let drag=null;
  root.addEventListener('pointerdown',e=>{
    const el=e.target.closest('[data-part]');if(!el||e.button>0)return;
    drag={id:el.dataset.part,x:e.clientX,y:e.clientY,ghost:null,moved:false,from:el};
    const move=ev=>{
      if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
      if(!drag.moved&&Math.hypot(dx,dy)>6){drag.moved=true;const g=drag.from.cloneNode(true);g.classList.add('ghost');g.style.width=drag.from.offsetWidth+'px';document.body.append(g);drag.ghost=g;drag.from.classList.add('dragging')}
      if(drag.ghost){drag.ghost.style.left=(ev.clientX-20)+'px';drag.ghost.style.top=(ev.clientY-14)+'px';ev.preventDefault();
        $$(root,'.wb-slot').forEach(s=>s.classList.remove('over'));const t=document.elementFromPoint(ev.clientX,ev.clientY);const sl=t&&t.closest&&t.closest('[data-slot]');if(sl&&root.contains(sl))sl.classList.add('over')}
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      if(!drag)return;const d=drag;drag=null;
      if(d.ghost){d.ghost.remove();d.from.classList.remove('dragging');
        const t=document.elementFromPoint(ev.clientX,ev.clientY),sl=t&&t.closest&&t.closest('[data-slot]'),tr=t&&t.closest&&t.closest('[data-tray]');
        if(sl&&root.contains(sl))place(d.id,sl.dataset.slot);else if(tr&&root.contains(tr))unplace(d.id);else draw()}
      else{sel=sel===d.id?null:d.id;draw();if(sel)fb(`Selected <b>${esc(byId[d.id].label)}</b>. Now tap the slot where it belongs.`)}
    };
    window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });
  root.addEventListener('click',e=>{
    const s=e.target.closest('[data-slot]');if(s&&sel&&!e.target.closest('[data-part]')&&!e.target.closest('[data-rm]'))place(sel,s.dataset.slot)});
  root.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;const p=e.target.closest&&e.target.closest('[data-part]');
    if(p){e.preventDefault();sel=sel===p.dataset.part?null:p.dataset.part;draw();return}});
  /* run */
  const showStep=()=>{
    const s=steps[si];$$(root,'.wb-slot').forEach(x=>{const id=x.dataset.slot;x.classList.toggle('lit',!!(s.lit&&s.lit.includes(id)));x.classList.toggle('dead',!!(s.dead&&s.dead.includes(id)))});
    $(root,'#st').innerHTML=`<div class="step"><h5>${esc(s.t)}</h5><p>${rich(s.d)}</p>${s.html||''}</div>`;
    $(root,'#bk').disabled=si===0;$(root,'#nx').disabled=si>=steps.length-1;$(root,'#pc').textContent=`step ${si+1} of ${steps.length}`;
    $(root,'#vd').hidden=si<steps.length-1;
  };
  $(root,'#run').onclick=()=>{
    const pl={};for(const k in placed)pl[k]=byId[placed[k]];
    const r=B.run(pl);steps=r.steps;si=0;verdict=r.verdict;
    $(root,'#res').innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:12px"><div id="st"></div><div class="row"><button class="btn" id="bk" type="button">Back</button><button class="btn pri" id="nx" type="button">Next step</button><button class="btn" id="pl" type="button">Play all</button><span class="pill" id="pc"></span></div><div id="vd" class="msg ${verdict.ok?'good':'bad'}" hidden><b>${verdict.ok?(verdict.complete?'Complete.':'Works.'):'Not yet.'}</b> ${rich(verdict.text)}</div></div>`;
    $(root,'#nx').onclick=()=>{si++;showStep()};$(root,'#bk').onclick=()=>{si--;showStep()};
    $(root,'#pl').onclick=async()=>{si=0;showStep();while(si<steps.length-1&&tk===ROUTE_TOKEN){await sleep(1400);if(tk!==ROUTE_TOKEN)return;si++;showStep()}};
    showStep();
    if(verdict.ok&&B.onDone)B.onDone(pl,verdict);
  };
  $(root,'#rs').onclick=()=>{placed={};sel=null;steps=[];$(root,'#res').innerHTML='';draw();fb(B.start||'Cleared. Start again.')};
  draw();
  return {place,placed:()=>placed};
}

/* ===== Build 0: transistors → NAND ===== */
const T_ROWS=[[0,0],[0,1],[1,0],[1,1]];
BUILDS.xtor={id:'xtor',title:'Transistors to NAND',cols:3,
 intro:'A gate is just transistors wired in the right pattern. Your goal: a NAND gate (output 0 only when both inputs are 1). An NMOS transistor turns ON when its input is 1 and connects the output to ground (0). A PMOS transistor turns ON when its input is 0 and connects the output to power (1).',
 start:'Place two NMOS transistors in the pull-down network, two PMOS in the pull-up network, then choose how each pair is wired.',
 slots:[
  {id:'pd1',label:'Pull-down: input A',need:'an NMOS transistor (ON when input = 1, connects to ground)',accepts:['nmos'],col:1,row:1},
  {id:'pd2',label:'Pull-down: input B',need:'an NMOS transistor',accepts:['nmos'],col:2,row:1},
  {id:'pdw',label:'Wire the pull-down pair',need:'"in a row" or "side by side"',accepts:['series','parallel'],col:3,row:1},
  {id:'pu1',label:'Pull-up: input A',need:'a PMOS transistor (ON when input = 0, connects to power)',accepts:['pmos'],col:1,row:2},
  {id:'pu2',label:'Pull-up: input B',need:'a PMOS transistor',accepts:['pmos'],col:2,row:2},
  {id:'puw',label:'Wire the pull-up pair',need:'"in a row" or "side by side"',accepts:['series','parallel'],col:3,row:2}],
 parts:()=>[
  {id:'n1',label:'NMOS transistor',kind:'nmos',desc:'ON when its gate is 1.',fits:'Connects the output toward ground (0) when ON.'},
  {id:'n2',label:'NMOS transistor',kind:'nmos',desc:'ON when its gate is 1.',fits:'Connects the output toward ground (0) when ON.'},
  {id:'p1',label:'PMOS transistor',kind:'pmos',desc:'ON when its gate is 0.',fits:'Connects the output toward power (1) when ON.'},
  {id:'p2',label:'PMOS transistor',kind:'pmos',desc:'ON when its gate is 0.',fits:'Connects the output toward power (1) when ON.'},
  {id:'s1',label:'Wired in a row (series)',kind:'series',desc:'Current must pass through both.',fits:'Both must be ON for this network to conduct (an AND).'},
  {id:'s2',label:'Wired in a row (series)',kind:'series',desc:'Current must pass through both.',fits:'Both must be ON for this network to conduct (an AND).'},
  {id:'r1',label:'Wired side by side (parallel)',kind:'parallel',desc:'Current can use either path.',fits:'Either being ON makes this network conduct (an OR).'},
  {id:'r2',label:'Wired side by side (parallel)',kind:'parallel',desc:'Current can use either path.',fits:'Either being ON makes this network conduct (an OR).'},
  {id:'rl',label:'Relay',kind:'relay',desc:'A mechanical switch.',reject:'It clicks and takes milliseconds, and it cannot be printed onto a chip.'},
  {id:'vt',label:'Vacuum tube',kind:'tube',desc:'A glowing glass switch.',reject:'It is big, hot and burns out. Chips use transistors instead.'}],
 run:(pl)=>{
  const need=['pd1','pd2','pdw','pu1','pu2','puw'],miss=need.filter(k=>!pl[k]);
  if(miss.length)return {steps:[{lit:[],dead:miss,t:'Incomplete',d:'These slots are still empty, so the gate cannot work yet.'}],verdict:{ok:false,text:'Fill every slot, then test again.'}};
  const pdS=pl.pdw.kind==='series',puS=pl.puw.kind==='series';
  const pd=(a,b)=>pdS?(a&&b):(a||b),pu=(a,b)=>puS?(!a&&!b):(!a||!b);
  const outs=[],steps=[];
  T_ROWS.forEach(([a,b])=>{const d=!!pd(a,b),u=!!pu(a,b);let out,txt;
    if(d&&u){out='short';txt='Both networks conduct: power is connected straight to ground. That is a short circuit.'}
    else if(u){out=1;txt='The pull-up network conducts, so the output is connected to power: 1.'}
    else if(d){out=0;txt='The pull-down network conducts, so the output is connected to ground: 0.'}
    else{out='float';txt='Neither network conducts: the output is connected to nothing (floating) and its value is unreliable.'}
    outs.push(out);
    steps.push({lit:d&&!u?['pd1','pd2','pdw']:u&&!d?['pu1','pu2','puw']:[],dead:(d&&u)||(!d&&!u)?['pd1','pd2','pdw','pu1','pu2','puw']:[],t:`Inputs A=${a}, B=${b}`,d:txt+` Output: <b>${out}</b>.`})});
  const nand=outs.join()==='1,1,1,0',nor=outs.join()==='1,0,0,0';
  const text=nand?'You built a **NAND** gate: 1 for every input except 1,1. Two NMOS in a row pull down only when both inputs are 1; two PMOS side by side pull up whenever at least one input is 0. Exactly one network conducts for every input, so there is never a short or a floating output. NAND is now in your Logic Lab.'
   :nor?'This is a working **NOR** gate (pull-down side by side, pull-up in a row). It is correct and also universal, but this challenge asks for NAND. Swap the two wirings.'
   :outs.includes('short')?'Some inputs connect power straight to ground (a short circuit). The two networks must be opposites: when one conducts, the other must not.'
   :'Some inputs leave the output connected to nothing. The two networks must cover every case between them: if the pull-down does not conduct, the pull-up must.';
  return {steps:steps.concat([{lit:[],t:'Result',d:'Outputs for inputs 00, 01, 10, 11: '+outs.join(', ')+'. A NAND gate gives 1, 1, 1, 0.'}]),verdict:{ok:nand,complete:nand,text}};
 },
 onDone:()=>{WS.done.xtor=true;wsSave();if(window.wsRefresh)wsRefresh()}};

BUILDS.cpu={id:'cpu',title:'Build a CPU',cols:3,
 intro:'A CPU is a small set of parts that repeat fetch, decode and execute. Drag each part into the place where it does its job, then power it on to run the add-up-numbers program from the CPU chapter.',
 start:'Start with the part that makes everything step together: the clock.',
 slots:[
  {id:'clock',label:'Heartbeat',need:'a clock: a steady pulse that makes every part step together',accepts:['clock'],col:1,row:1},
  {id:'pc',label:'Next-instruction address',need:'a register holding the address of the next instruction',accepts:['pc'],col:2,row:1},
  {id:'ir',label:'Current instruction',need:'a register holding the instruction being worked on',accepts:['ir'],col:3,row:1},
  {id:'control',label:'The conductor',need:'a control unit that reads the instruction and switches the right paths',accepts:['control'],col:1,row:2},
  {id:'alu',label:'The calculator',need:'an ALU, which adds, subtracts and compares',accepts:['alu'],col:2,row:2},
  {id:'acc',label:'Working number',need:'a register that holds the number being worked on',accepts:['acc'],col:3,row:2},
  {id:'memif',label:'Door to memory',need:'a memory interface (address and data wires out to RAM)',accepts:['memif'],col:1,row:3},
  {id:'bus',label:'Shared wires',need:'an internal bus carrying values between parts',accepts:['bus'],col:2,row:3},
  {id:'cache',label:'Nearby copy',need:'a cache (small, fast copy of recent memory)',accepts:['cache'],col:3,row:3,optional:true}],
 parts:()=>[
  {id:'clock',label:'Clock',kind:'clock',desc:'A steady on-off pulse for every part.',fits:'Every register will now change on its ticks.'},
  {id:'pc',label:'Program counter',kind:'pc',desc:'Remembers the address of the next instruction.',fits:'It is the CPU\'s finger on the recipe line.'},
  {id:'ir',label:'Instruction register',kind:'ir',desc:'Holds the instruction being decoded.'},
  {id:'acc',label:'Accumulator',kind:'acc',desc:'A register for the number being worked on.'},
  {id:'control',label:'Control unit',kind:'control',desc:'Decodes the instruction and opens the right paths.'},
  {id:'alu',label:'ALU',kind:'alu',desc:'Does arithmetic and comparisons.'},
  {id:'memif',label:'Memory interface',kind:'memif',desc:'Address and data wires to RAM.'},
  {id:'bus',label:'Internal bus',kind:'bus',desc:'Shared wires between parts.'},
  {id:'cache',label:'Cache',kind:'cache',desc:'A small, fast copy of recently used memory.'},
  {id:'hdd',label:'Hard disk',kind:'storage',desc:'Keeps data when power is off.',reject:'It is a separate, far slower device that connects to the computer, not a part inside the CPU.'},
  {id:'gpu',label:'Graphics chip',kind:'gpu',desc:'A processor for drawing pixels.',reject:'It is a separate chip with its own job. (Some CPUs bundle a small one, but it is not part of this basic design.)'},
  {id:'fan',label:'Cooling fan',kind:'fan',desc:'Moves air over the chip.',reject:'It cools the chip from outside; it is not part of the circuit.'},
  {id:'kb',label:'Keyboard',kind:'keyboard',desc:'An input device.',reject:'It plugs in from outside; the CPU does not contain one.'}],
 run:(pl)=>{
  const S=[],miss=id=>!pl[id];
  if(miss('clock'))return {steps:[{lit:[],dead:['clock'],t:'Power on',d:'There is no clock, so no part ever gets a tick. Nothing moves: the CPU is frozen.'}],verdict:{ok:false,text:'Add a clock so every part has a shared beat.'}};
  S.push({lit:['clock'],t:'Power on',d:'The clock starts ticking, billions of times a second in a real chip. Every register now waits for its tick.'});
  const fetchNeed=['pc','memif','ir','bus'],fm=fetchNeed.filter(miss);
  if(fm.length)return {steps:S.concat([{lit:['clock'],dead:fm,t:'Fetch',d:'The CPU must fetch the first instruction: send the address from the program counter out through the memory interface, over the bus, and into the instruction register. Missing: '+fm.map(x=>({pc:'program counter (nothing tells it where the next instruction is)',memif:'memory interface (no way to reach RAM)',ir:'instruction register (nowhere to put the instruction)',bus:'bus (no shared wires between parts)'})[x]).join('; ')+'.'}]),verdict:{ok:false,text:'The fetch step needs a program counter, instruction register, memory interface and a bus.'}};
  S.push({lit:['pc','bus','memif','ir'],t:'Fetch',d:'The program counter\'s value goes out through the memory interface. RAM answers with the instruction `LOAD 12`, which lands in the instruction register. The counter moves on by one.'});
  if(miss('control'))return {steps:S.concat([{lit:['ir'],dead:['control'],t:'Decode',d:'The instruction register now holds `LOAD 12`, which is just a pattern of bits. With no control unit nothing turns that pattern into actions.'}]),verdict:{ok:false,text:'Add a control unit to decode instructions.'}};
  S.push({lit:['ir','control'],t:'Decode',d:'The control unit reads the opcode bits and switches on the right paths: "read memory address 12, put the value in the working register".'});
  const em=['alu','acc'].filter(miss);
  if(em.length)return {steps:S.concat([{lit:['control'],dead:em,t:'Execute',d:'Loading works, but the program soon reaches `ADD 13`. '+(miss('alu')?'With no ALU there is nothing to do the addition. ':'')+(miss('acc')?'With no working register there is nowhere to keep the running total.':'')}]),verdict:{ok:false,text:'Execute needs an ALU and a register to hold the working number.'}};
  S.push({lit:['control','alu','acc','bus'],t:'Execute',d:'`ADD 13`: the control unit sends the accumulator and the value from memory into the ALU. The ALU adds them and the result goes back into the accumulator. Then `STORE 12` writes it back to memory, and `JNZ 0` changes the program counter to loop.'});
  const cache=!miss('cache');
  S.push({lit:['clock','pc','ir','control','alu','acc','memif','bus'].concat(cache?['cache']:[]),t:'The loop runs',d:'The program repeats fetch, decode, execute 36 times (35 instructions in the loop, then HALT). Memory cell 12 ends up holding <b>15</b> (5+4+3+2+1). '+(cache?'The cache keeps the few instructions and numbers the loop reuses close at hand, so most memory reads are fast hits.':'There is no cache, so every one of those memory reads waits for RAM. It works, but slowly: the Distance chapter explains why a cache helps.')});
  return {steps:S,verdict:{ok:true,complete:true,text:'Your CPU repeats fetch, decode, execute and computed 15. '+(cache?'You also added a cache.':'It works. Try adding a cache for speed.')}};
 },
 onDone:()=>{WS.done.cpu=true;wsSave();if(window.wsRefresh)wsRefresh()}};

/* ===== Build 2: motherboard ===== */
function boardFaults(pl){
  const f=[];
  if(!pl.vrm)f.push(['vrm','No voltage regulators: the power supply gives about 12 V, but the CPU needs a low voltage around 1 V. The CPU never starts.']);
  if(!pl.cpu)f.push(['cpu','No CPU in the socket, so there is nothing to run any instruction.']);
  if(!pl.firmware)f.push(['firmware','No firmware chip. The CPU wakes up with nothing telling it what to do first.']);
  if(!pl.ram1)f.push(['ram1','No RAM. The firmware\'s memory test fails and the board gives error beeps instead of starting.']);
  if(!pl.chipset)f.push(['chipset','No chipset: the CPU has no hub connecting it to storage, USB and network.']);
  if(!pl.storage)f.push(['storage','Firmware works, but no storage is installed. It reports "no bootable device".']);
  return f;
}

 parts:()=>[

  {id:'ramS',label:'Laptop RAM (SO-DIMM)',kind:'ramS',desc:'A smaller stick for laptops.',reject:'It is a different size and does not fit a desktop memory slot.'},

  {id:'ssd',label:'SSD',kind:'ssd',desc:'Flash storage, no moving parts.'},
  {id:'hdd',label:'Hard disk',kind:'hdd',desc:'Spinning-platter storage.'},
  {id:'gpu',label:'Graphics card',kind:'gpu',desc:'Many small cores for graphics.'},
  {id:'nic',label:'Wi-Fi adapter',kind:'nic',desc:'Wireless network.'},
  {id:'io',label:'USB and audio ports',kind:'io',desc:'Connect keyboard, mouse, headphones.'},
  {id:'cmos',label:'Coin battery',kind:'cmos',desc:'Keeps the clock running when unplugged.'},
  {id:'psu',label:'Power supply',kind:'psu',desc:'Turns wall power into DC.',reject:'It is a big box that sits in the case and plugs in by cable. You add it in the next build.'},
  {id:'mon',label:'Monitor',kind:'display',desc:'A screen.',reject:'It connects by a cable to a port, not onto the board itself.'}],

function geom(p){
  if(p.type==='IN')return {w:80,h:36,ins:[],outs:[{n:'out',x:80,y:18}]};
  if(p.type==='OUT')return {w:80,h:36,ins:[{n:'in',x:0,y:18}],outs:[]};
  if(p.type==='HIGH')return {w:70,h:30,ins:[],outs:[{n:'out',x:70,y:15}]};
  const pins=partPins(p.type),n=Math.max(pins.ins.length,pins.outs.length),h=n*22+22,w=p.type==='NAND'?100:136;
  return {w,h,ins:pins.ins.map((k,i)=>({n:k,x:0,y:26+i*22})),outs:pins.outs.map((k,i)=>({n:k,x:w,y:26+i*22}))};
}

   <aside class="wb-side"><h5>Parts bin <small>(drag onto the canvas, or tap to add. On a phone: tap a pin, then tap a second pin to wire.)</small></h5><div class="wb-tray" id="pal"></div></aside></div>
  <div class="msg" id="fb" role="status"></div><div id="res"></div></div>`;

  const fb=(t,c)=>{const f=$(root,'#fb');f.className='msg '+(c||'');f.innerHTML=t};
  const load=()=>{if(!designs[P().id])designs[P().id]=designFromSpec(P());design=designs[P().id];design.parts.forEach(p=>{if(p.type==='IN'&&vals[p.id]===undefined)vals[p.id]=(P().init&&P().init[p.name])||0});sel=null;pending=null;results=null;hint=false;confirmSol=false;ctr=Math.max(ctr,design.parts.length+design.wires.length);rebuild();drawAll();$(root,'#res').innerHTML='';
    fb(P().goal+' Drag a part from the bin onto the canvas, then drag from a round pin to another pin to connect them.')};
  const rebuild=()=>{sim=makeSim(design);applyIn()};

  /* palette */

    PUZ.forEach((p,i)=>{if(i<pi&&LIB[p.name])items.push({t:p.name,l:p.name,d:p.ins.join(', ')+' → '+p.outs.join(', ')})});return items};
  const drawPal=()=>{$(root,'#pal').innerHTML=palette().map(it=>`<div class="wb-part" data-pal="${it.t}" tabindex="0" role="button"><b>${esc(it.l)}</b><small>${esc(it.d)}</small></div>`).join('')};
  /* rendering */

  const drawPuz=()=>{
    $(root,'#pz').innerHTML=PUZ.map((p,i)=>`<button class="btn ${i===pi?'sel':''}" type="button" data-pz="${i}">${WS.solved[p.id]?'✓ ':''}${p.name}</button>`).join('');

  if(f) f.style.width = (100*n/CH.length)+'%';
  if(l) l.textContent = `${n} of ${CH.length} checks answered correctly`;
  $$(document,'#rail a[data-id] i').forEach(i=>{ const id=i.parentNode.dataset.id; if(id!=='start'&&id!=='glossary'&&id!=='gallery'&&id!=='workshop') i.textContent = done.has(id)?'✓':''; });
}
function route(){
  cleanups.forEach(f=>{try{f()}catch(e){}}); cleanups=[]; ROUTE_TOKEN++;
  const id = (location.hash||'#start').slice(1) || 'start';
  const isGal = id==='gallery' || id.startsWith('gallery-');
  const isWs = id==='workshop' || id.startsWith('workshop-');
  const main = $(document,'#main');
  $$(document,'#rail a').forEach(a=>a.removeAttribute('aria-current'));
  const cur = $(document,`#rail a[data-id="${isGal?'gallery':isWs?'workshop':id}"]`); if(cur) cur.setAttribute('aria-current','page');
  $(document,'#rail').classList.remove('open');const sc=$(document,'#scrim');if(sc)sc.classList.remove('show');
  if(isWs) main.replaceChildren(renderWorkshop(id==='workshop'?'':id.slice(9)));
  else if(isGal) main.replaceChildren(renderGallery());
  else if(id==='glossary') main.innerHTML = renderGlossary();
  else if(ORDER.includes(id)) main.replaceChildren(renderChapter(CH[ORDER.indexOf(id)]));
  else main.innerHTML = renderHome();
  if(id==='glossary') wireGlossary();
  if(isGal && id!=='gallery'){ const t=document.getElementById('fig-'+id.slice(8)); if(t) t.scrollIntoView(); else window.scrollTo(0,0); }
  else window.scrollTo(0,0);
  document.title = 'Ground Up Computing';
}

/* ---------- pages ---------- */
function renderHome(){
  const stack = CH.map(c=>`<a href="#${c.id}"><b>${esc(c.word)}</b><span>${rich(c.plain.split('. ')[0].replace(/\.$/,''))}</span></a>`).join('');
  return `<div class="col"><div class="hero"><div class="crumb">An interactive course in how computers work</div>
  <h1>A computer, from the <em>first switch</em> to a working bank.</h1>
  <p>${CH.length} short chapters. Each one starts with the problem that forced the idea to exist, builds the idea from its simplest parts, then lets you operate a live model of it.</p>
  <p><a class="btn pri" style="text-decoration:none;display:inline-block" href="#bit">Start with the bit</a></p></div>
  <div class="card"><h2 style="font-size:1.3rem;margin-bottom:10px">How every chapter is laid out</h2>
  <div class="sec" style="margin-top:10px"><h3>Word</h3><div><p>One word that holds the whole concept. If you remember only that, you remember the heart of it.</p></div>
  <h3>Plain</h3><div><p>The idea in one simple sentence, followed by a table that translates textbook language into everyday language.</p></div>
  <h3>Why</h3><div><p>The problem that made the idea necessary.</p></div>
  <h3>What</h3><div><p>The idea itself, built from the smallest pieces.</p></div>
  <h3>How</h3><div><p>What actually happens inside.</p></div>
  <h3>Real</h3><div><p>A familiar thing it resembles.</p></div>
  <h3>Trap</h3><div><p>A common mistake and why people make it.</p></div>
  <h3>Try</h3><div><p>A live model. Press things. Break things.</p></div></div></div>
  <a class="card" href="#workshop" style="text-decoration:none;color:inherit;display:block"><div class="crumb">New</div><h2 style="font:800 1.5rem var(--f-display);color:var(--accent);margin:4px 0">Workshop</h2><p style="margin:0">Build it yourself. Wire gates from NAND, grow them into an adder, a latch and a register, then drag the parts of a CPU, a motherboard and a whole computer into place and boot it.</p></a>
  <a class="card" href="#gallery" style="text-decoration:none;color:inherit;display:block"><div class="crumb">New</div><h2 style="font:800 1.5rem var(--f-display);color:var(--accent);margin:4px 0">Picture book</h2><p style="margin:0">Eight pictures you can play with: a pizza kitchen for memory, a restaurant floor for the OS, a post office for the internet, and more. No reading needed.</p></a>
  <div class="msg sig"><b>Dig down as far as you like.</b> Any word with a <button class="term" type="button" data-k="abstraction" aria-expanded="false">dotted underline</button> opens its definition right below. Definitions contain more dotted words, so you can keep asking "but what is that?" until you reach something you already know.</div>
  <div><h2 style="font-size:1.3rem;margin-bottom:10px">The whole stack (bottom is where it starts)</h2><div class="stack">${stack}</div></div>
  <div class="msg"><b>Limits of this course.</b> Numbers such as latencies, clock speeds and transistor counts are approximate and change by machine and year. Real hardware has more complexity than a teaching model, and the demos are simplified on purpose. Where a figure varies a lot, the text says so.</div></div>`;
}
function renderGlossary(){
  const keys = Object.keys(G).sort((a,b)=>G[a][0].localeCompare(G[b][0]));
  return `<div class="col"><div><div class="crumb">Reference</div><h1 style="font:800 clamp(2.4rem,7vw,4rem) var(--f-display);color:var(--accent)">Glossary</h1></div>
  <input type="search" id="glq" placeholder="Search ${keys.length} terms" aria-label="Search glossary">
  <dl class="gl" id="gllist">${keys.map(k=>`<div data-s="${esc((G[k][0]+' '+G[k][1]).toLowerCase())}"><dt>${esc(G[k][0])}</dt><dd>${rich(G[k][1])}</dd></div>`).join('')}</dl></div>`;
}
function wireGlossary(){
  const q=$(document,'#glq');
  q.oninput=()=>{const v=q.value.toLowerCase();$$(document,'#gllist>div').forEach(d=>d.hidden=!d.dataset.s.includes(v));};
}
const WORK_FOR={transistor:['xtor','Workshop: wire transistors into a NAND gate'],gates:['lab','Workshop: wire gates in the Logic Lab'],adder:['lab','Workshop: build an adder in the Logic Lab'],latch:['lab','Workshop: build a latch in the Logic Lab'],clock:['lab','Workshop: build a flip-flop in the Logic Lab'],registers:['lab','Workshop: build a register in the Logic Lab'],cpu:['cpu','Workshop: assemble a CPU'],home:['computer','Workshop: assemble and boot a computer'],company:['company','Workshop: design a web store'],bank:['bank','Workshop: build a bank system']};
function renderChapter(c){
  const i = ORDER.indexOf(c.id), prev = CH[i-1], next = CH[i+1];
  const el = document.createElement('div'); el.className='col';
  const secs = [
    ['Why', c.why, 'The problem that forced this idea to exist'],
    ['What', c.what, 'The idea, from first principles'],
    ['How', c.how, 'What happens behind the scenes'],
    ['Real', c.real, 'A familiar thing it resembles'],
  ].filter(s=>s[1]&&s[1].length);
  const sec = ([h,paras]) => `<section class="sec"><h3>${h}</h3><div>${paras.map(p=>`<p>${rich(p)}</p>`).join('')}</div></section>`;
  el.innerHTML = `<div><div class="crumb">${esc(PARTS[c.part])} · chapter ${i+1} of ${CH.length}</div>
    <div class="word">${esc(c.word)}</div><div class="ctitle">${esc(c.title)}</div></div>
    <p class="plain"><small>In one sentence</small>${rich(c.plain)}</p>
    <div class="card scroll"><table class="tr"><thead><tr><th>Textbook says</th><th>Plain English</th></tr></thead><tbody>${c.tr.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>
    ${secs.map(sec).join('')}
    <section class="sec trap"><h3>Trap</h3><div><p><b>${esc(c.trap[0])}</b></p><p>${rich(c.trap[1])}</p></div></section>
    <div class="demo" id="demo"><header><span>Try it</span><span>${esc(c.word)}</span></header><div class="demo-body"></div></div>
    <div class="card quiz" id="quiz"></div>
    <nav class="pager" aria-label="Chapters">${prev?`<a href="#${prev.id}"><small>Previous</small>${esc(prev.word)}</a>`:'<span></span>'}${next?`<a class="next" href="#${next.id}"><small>Next</small>${esc(next.word)}</a>`:''}</nav>`;
  const d = DEMOS[c.demo];
  const body = $(el,'.demo-body');
  if(d){ const note=document.createElement('p'); note.className='demo-note'; note.textContent=d.note; body.append(note); const mount=document.createElement('div'); mount.style.cssText='display:flex;flex-direction:column;gap:16px;min-width:0'; body.append(mount); d.mount(mount); }
  buildQuiz($(el,'#quiz'),c);
  if(WORK_FOR[c.id]){ const q=document.createElement('p'); q.className='demo-note'; q.innerHTML='Build it yourself: <a class="chlink" href="#workshop-'+WORK_FOR[c.id][0]+'">'+esc(WORK_FOR[c.id][1])+'</a>'; $(el,'#demo').after(q); }
  if(PIC_FOR[c.id]){ const p=document.createElement('p'); p.className='demo-note'; p.innerHTML='See it as a picture: '+PIC_FOR[c.id].map(k=>`<a class="chlink" href="#gallery-${k}">${esc(GAL.find(g=>g.id===k).title)}</a>`).join(' · '); $(el,'#demo').after(p); }
  return el;
}
function buildQuiz(box,c){
  const rnd = seeded(c.id); const idx = c.quiz.o.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  box.innerHTML = `<h5 style="margin:0;font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)">Check yourself</h5>
   <p style="margin:6px 0 0;font-weight:600">${esc(c.quiz.q)}</p><div class="opts">${idx.map(i=>`<button class="btn" type="button" data-i="${i}">${esc(c.quiz.o[i])}</button>`).join('')}</div><div class="fb" role="status"></div>`;
  $$(box,'.opts .btn').forEach(b=>b.onclick=()=>{
    const ok = +b.dataset.i===c.quiz.a;
    b.classList.add(ok?'right':'wrong');
    $(box,'.fb').innerHTML = ok?`<div class="msg good"><b>Correct.</b> ${esc(c.quiz.why)}</div>`:`<div class="msg bad">Not quite. Re-read the <b>Why</b> and <b>What</b> parts, then try another option.</div>`;
    if(ok){ $$(box,'.opts .btn').forEach(x=>x.disabled=true); done.add(c.id); saveDone(); updateProgress(); }
  });
}
function init(){
  wsLoad();
  buildRail();
  window.addEventListener('hashchange',route);
  const rail=$(document,'#rail'),scrim=$(document,'#scrim'),mb=$(document,'#menubtn');
  const setOpen=o=>{rail.classList.toggle('open',o);scrim.classList.toggle('show',o);mb.setAttribute('aria-expanded',String(o))};
  mb.onclick=()=>setOpen(!rail.classList.contains('open'));
  scrim.onclick=()=>setOpen(false);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
  rail.addEventListener('click',e=>{if(e.target.closest('a'))setOpen(false)});
  window.addEventListener('hashchange',()=>setOpen(false));
  route();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
</script>
