insertAfter('cpu',[
{id:'pipeline',part:'B',word:'Overlap',title:'Pipelining and branch prediction',
 plain:'A [[pipeline]] starts the next instruction before the last one has finished, like an assembly line, and [[branch-prediction|guesses]] which way the code will go so the line never sits empty.',
 tr:[['A pipeline increases instruction throughput.','More instructions finish per second, even though each takes just as long.'],
     ['A mispredicted branch causes a pipeline flush.','A wrong guess means throwing away the half-done work and restarting.'],
     ['Data hazards can stall the pipeline.','An instruction sometimes has to wait for the result of the one before it.']],
 why:['The basic cycle does one instruction fully (fetch, decode, execute, memory, write back) before starting the next. But while the ALU is executing, the fetch hardware is idle, and so on. Most of the chip sits unused most of the time.'],
 what:['Split the work into stages, each with its own hardware. Like a laundry with a washer, a dryer and a folding table: while load 1 dries, load 2 is already washing. After a short start-up, one instruction completes every cycle. With 5 stages, N instructions need about N + 4 cycles instead of 5 x N.',
       'Problem: a [[branch]] ("if") decides which instruction comes next, but the answer is only known when the branch reaches the execute stage. By then the pipeline has already fetched the next ones. The CPU therefore guesses ([[branch-prediction]]), often using the past behaviour of that same branch. If right, nothing is lost. If wrong, the fetched instructions are thrown away ([[flush]]) and the correct ones start.'],
 how:['Each stage is separated by [[register]]s that hold the work in progress, all moving forward on each [[clock]] tick.',
      'Another problem is a [[hazard]]: instruction 2 needs the result instruction 1 has not written yet. CPUs solve this by passing the result straight between stages (forwarding) or by pausing for a cycle.',
      'Real pipelines are deeper than five stages, and a mispredicted branch often costs on the order of ten or more cycles on modern designs. That is why predictors are elaborate. The demo uses a small penalty so you can see the effect.',
      'Predictors also explain why the same code can run at different speeds depending on the data: sorted data makes a branch predictable, random data does not.'],
 real:['A car factory line: the chassis, engine and paint stations all work at once on different cars. A change of plan mid-line means cars already half-built must be scrapped.'],
 trap:['"Pipelining makes each instruction faster"','Each still takes the same number of cycles from start to finish. What improves is how many finish per second. It is throughput, not latency.'],
 demo:'pipeline',
 quiz:{q:'What does a wrong branch guess cost?',o:['Nothing, the CPU undoes it instantly','The half-done work on the wrong path is discarded and cycles are lost','The program crashes','Memory is erased'],a:1,why:'The pipeline is flushed and the correct instructions start later.'}},

{id:'gpu',part:'B',word:'Crowd',title:'GPUs and parallel work',
 plain:'A [[gpu]] is a chip with thousands of small workers that all do the same operation on different data at the same moment.',
 tr:[['A GPU is a throughput-oriented parallel processor.','Slow at one thing, great at doing a million similar things together.'],
     ['SIMT executes one instruction across many threads.','One order, followed by a whole crowd, each on its own piece of data.'],
     ['Data dependence limits parallel speed-up.','If each step needs the previous step\'s answer, a crowd cannot help.']],
 why:['A screen has millions of pixels, and each must be coloured about 60 times a second. A CPU with a handful of [[core]]s, each very clever at running one complicated line of work, would do the pixels in long queues. The pixels are mostly independent of each other, so there is a better design.'],
 what:['Trade cleverness for numbers. A GPU has far more, far simpler units. A [[shader]] program is run for every pixel, with many units working at once ([[simd|lanes]]). Time is roughly the number of items divided by the number of lanes.',
       'The same shape of work appears outside graphics: machine learning, video encoding, scientific simulation. Anything that is "do the same simple maths to a huge array" fits.'],
 how:['A CPU spends many of its transistors on cache, prediction and reordering to make a single stream fast. A GPU spends them on arithmetic units and hides memory waiting by switching to other groups of workers.',
      'Limits: if each item needs the previous item\'s result, there is nothing to run at the same time. Code full of different branches per item wastes lanes. Moving data between the CPU\'s memory and the GPU\'s memory also costs time, so small jobs may be faster on the CPU.'],
 real:['One master chef versus a thousand cooks each stamping the same logo onto a cookie. Stamping is quicker with the crowd. Making a single wedding cake with strict steps is not.'],
 trap:['"A GPU is just a faster CPU"','It is faster only for the right shape of work. For one long chain of dependent steps it is slower than a CPU, because each of its workers is individually weak.'],
 demo:'gpu',
 quiz:{q:'When does a GPU give little benefit?',o:['Colouring millions of independent pixels','Each step needs the result of the previous step','Adding two huge arrays','Applying one filter to a photo'],a:1,why:'Dependent steps cannot run side by side.'}},
]);
insertAfter('storage',[
{id:'journal',part:'C',word:'Journal',title:'Surviving a crash while saving',
 plain:'A [[journal]] is a log where the file system writes down what it is about to do, so after a crash it knows how to finish or ignore a half-done change.',
 tr:[['Journaling gives crash consistency for metadata updates.','The catalogue stays correct even if the power fails mid-save.'],
     ['A commit record marks a complete journal transaction.','A final tick mark that says "this whole change is safe to apply".']],
 why:['Saving a file is several writes: mark a block as used, write the data into it, add the name to the folder. The power can fail between any two. Without protection you can end up with a block marked used that no file owns, or a name pointing at nothing. Older systems had to scan the entire disk after a crash to repair this, which took long on big disks.'],
 what:['Write the plan first. Before touching the real structures, append to the [[journal]]: "I am going to allocate block 9, write this data, add this name", then a COMMIT mark. Only then do the real writes.',
       'After a crash, recovery reads the journal. A plan without COMMIT is ignored, since nothing real has changed yet. A plan with COMMIT is replayed to completion. Either way, the change is all-or-nothing, the same idea as database transactions.'],
 how:['The journal is small and sequential, so checking it after a crash takes seconds rather than scanning the whole disk.',
      'Systems such as ext4 and NTFS use journals. Others, such as ZFS and Apple\'s APFS, use a different approach called copy-on-write: they never overwrite live data, and switch to the new version in a single final step.',
      'Cost: data is written twice (journal, then final place), so many systems journal only the catalogue changes, not every file content byte.'],
 real:['A builder who files the work order before starting. If they vanish mid-job, the order shows exactly what was planned and whether it was approved.'],
 trap:['"Journaling means my file contents can never be lost"','Many journals protect the catalogue, not the content of data you were still writing. The structure stays valid, but the newest bytes of an unsaved file can be missing.'],
 demo:'journal',
 quiz:{q:'After a crash, the journal has a plan but no COMMIT mark. What does recovery do?',o:['Replays it','Ignores it because nothing real was changed yet','Deletes the disk','Asks the user'],a:1,why:'Without COMMIT, the real structures were never touched.'}},
]);
insertAfter('company',[
{id:'cloud',part:'G',word:'Rental',title:'Virtual machines, containers and the cloud',
 plain:'The [[cloud]] means renting slices of someone else\'s computers by the hour, and software ([[vm]]s and [[container]]s) is what cuts one physical machine into many safe pieces.',
 tr:[['A hypervisor multiplexes hardware among virtual machines.','Software that lets one real computer pretend to be several.'],
     ['Containers share the host kernel.','Cheaper isolation: separate rooms in the same house instead of separate houses.'],
     ['Elastic capacity scales with demand.','Add servers at busy times and remove them when quiet.']],
 why:['A company that buys servers for its busiest day pays for idle machines the rest of the year. A company that buys too few fails on the busy day. And one app per physical machine wastes most of each machine. We need to share machines safely, and to grow and shrink quickly.'],
 what:['A [[hypervisor]] runs several [[vm]]s on one machine; each thinks it has a whole computer and its own OS. A [[container]] is lighter: the OS [[kernel]] isolates groups of [[process]]es so each sees only its own files and network, but all share the one kernel. Containers start in a moment and pack more densely.',
       'The [[cloud]] provider owns the [[data-center]]s. You request machines through software, pay for the time used, and release them. [[autoscaling]] does the requesting and releasing by rule, for example "keep servers about 60% busy".'],
 how:['Isolation in a VM comes from the CPU\'s virtualisation support and a separate OS per VM. In a container it comes from the kernel features that hide other processes and limit the CPU and memory a group may use.',
      'A container image bundles the program with exactly the libraries it needs, so it runs the same on a laptop and on a server.',
      'New servers are not instant. Starting takes seconds to minutes, so autoscaling reacts to demand a little late; sudden spikes can still overload the system before help arrives.'],
 real:['Hotel versus owning a house. You pay for the nights used, and can book more rooms for a wedding weekend. Containers are rooms in one building; VMs are separate flats each with its own front door.'],
 trap:['"The cloud is not a real computer"','It is real machines in a real building. The change is in who owns them and how you request them. If the building loses power, or you misconfigure your own setup, you can still go down.'],
 demo:'cloud',
 quiz:{q:'What do containers share that separate virtual machines do not?',o:['The host operating system kernel','The CPU clock','Nothing','The same files'],a:0,why:'That sharing is why they are lighter and start faster.'}},
]);
insertAfter('algorithms',[
{id:'compression',part:'F',word:'Shrink',title:'Compression',
 plain:'[[compression]] saves space by giving common things short codes and rare things long ones, or by dropping detail nobody will miss.',
 tr:[['Huffman coding assigns variable-length prefix codes by frequency.','Frequent letters get short codes, rare letters get long ones.'],
     ['Lossless compression is reversible.','You can get back exactly what you started with.'],
     ['Entropy bounds lossless compression.','Truly random data cannot be squeezed.']],
 why:['Storage and bandwidth cost money and time. A page of English uses 8 bits per letter, yet the letter "e" appears constantly and "z" rarely. Using the same size for both wastes space.'],
 what:['Idea one: **variable-length codes**. Give "e" a 2-bit code and "z" a 6-bit code. Because the rules must still allow decoding, no code may be the start of another ([[prefix-free]]). Huffman coding builds the best such code from letter counts: repeatedly join the two rarest items under a new parent until one tree remains; the path from the top (left = 0, right = 1) is each letter\'s code.',
       'Idea two: **lossless vs lossy**. [[lossless]] (ZIP, PNG) restores every bit. [[lossy]] (JPEG, MP3) discards detail people are unlikely to notice and can get much smaller, but the original is gone.'],
 how:['The decoder walks the tree: read bits until a leaf, output that letter, start again from the top. The tree (or the counts) must be stored with the data, so very short text may not shrink at all.',
      'Compression exploits patterns. If the data has none (already compressed or random), there is nothing to remove. A counting argument shows that no method can shrink every possible file: there are fewer short bit strings than long ones.'],
 real:['Shorthand writing: you make a symbol for "the" because you write it all the time. Texting "brb" is lossless shorthand for people who know the code.'],
 trap:['"Compressing a ZIP again makes it smaller again"','The first pass already removed the patterns. A second pass finds none, and often adds a little overhead instead.'],
 demo:'huffman',
 quiz:{q:'Why does a Huffman code give "e" a shorter code than "z" in English text?',o:['Alphabetical order','"e" is far more frequent, so short codes save the most space','"z" is illegal','It is random'],a:1,why:'Short codes go where they are used most.'}},
]);
const DEMOS = {};
const bin = (n,w=8) => n.toString(2).padStart(w,'0');
const lamp = on => `<span class="pill ${on?'sig':''}">${on?'LAMP ON':'lamp off'}</span>`;
const bitBtn = (v,i,lab) => `<button class="bit ${v?'on':''}" type="button" data-i="${i}" aria-pressed="${!!v}" aria-label="${lab||'bit'} ${v}">${v}${lab!==undefined?`<small>${lab}</small>`:''}</button>`;

/* ---- 1. bits ---- */
DEMOS.bits = {note:'Click a switch to flip it. The same eight bits are shown as a number, in hex and as a letter. The meaning comes from how you choose to read them.',
mount(r){
  let v=[0,1,0,0,0,0,0,1];
  r.innerHTML=`<div class="row" id="sw"></div>
  <div class="grid g3"><div><h5>Read as a number</h5><div class="out" id="dec"></div></div><div><h5>Read as hex</h5><div class="out" id="hex"></div></div><div><h5>Read as a letter (ASCII)</h5><div class="out" id="chr"></div></div></div>
  <div><h5>How many patterns can n bits make?</h5><div class="row"><input type="range" id="nb" min="1" max="16" value="8" aria-label="number of bits"><span class="out" id="npat"></span></div></div>
  <div><h5>Type text and see its bits</h5><input type="text" id="txt" value="Hi" maxlength="12" aria-label="text to encode"><div class="out" id="tb" style="margin-top:8px"></div></div>`;
  const draw=()=>{
    $(r,'#sw').innerHTML=v.map((b,i)=>bitBtn(b,i,2**(7-i))).join('');
    const n=parseInt(v.join(''),2);
    $(r,'#dec').textContent=n; $(r,'#hex').textContent='0x'+n.toString(16).toUpperCase().padStart(2,'0');
    $(r,'#chr').textContent=(n>=32&&n<127)?`'${String.fromCharCode(n)}'`:'(not a printable letter)';
    $$(r,'#sw .bit').forEach(b=>b.onclick=()=>{v[+b.dataset.i]^=1;draw()});
  };
  const upd=()=>{const n=+$(r,'#nb').value;$(r,'#npat').textContent=`${n} bits → ${(2**n).toLocaleString()} patterns`};
  const txt=()=>{$(r,'#tb').textContent=[...$(r,'#txt').value].map(c=>c.charCodeAt(0)<128?bin(c.charCodeAt(0)):'(non-ASCII)').join(' ')||'(empty)'};
  $(r,'#nb').oninput=upd; $(r,'#txt').oninput=txt; draw(); upd(); txt();
}};

/* ---- 2. timeline ---- */
const EARLY=[
{y:'1837',n:'Analytical Engine (design)',s:'A design for a machine that follows any list of steps, with punched cards for the steps, a "store" for numbers and a "mill" to calculate (Charles Babbage).',i:'It needed thousands of precisely made gears and was not completed in his lifetime.'},
{y:'1936',n:'Turing machine (theory)',s:'Alan Turing described an idealised machine that follows rules on a tape, and argued that it can carry out any step-by-step procedure. This pinned down what "computable" means.',i:'It is a mathematical model, not a fast buildable machine.'},
{y:'1941',n:'Zuse Z3',s:'A working programmable binary computer made from electromechanical relays (Konrad Zuse, Germany). Programs were read from punched film.',i:'Relays are slow and wear out from movement. The program was not held in the machine\'s memory.'},
{y:'1943–44',n:'Colossus',s:'Used vacuum tubes to attack coded German messages far faster than relays allowed (UK).',i:'Built for one kind of task, and set up with switches and plugs.'},
{y:'1945',n:'ENIAC',s:'A general-purpose electronic computer with roughly 17,000 vacuum tubes, much faster than mechanical calculators.',i:'Tubes burned out and gave off great heat (it weighed about 30 tons). Changing the job meant re-plugging cables and setting switches, which took days.'},
{y:'1945',n:'Stored-program design (EDVAC report)',s:'Von Neumann\'s report described holding instructions and data in the same memory, so a new job is new numbers, not new wiring.',i:'One path between CPU and memory for both instructions and data becomes a bottleneck, later called the von Neumann bottleneck. Caches soften it today.'},
{y:'1947',n:'The transistor',s:'Invented at Bell Labs: a small, cool, solid switch with no moving parts to replace tubes.',i:'Single transistors still had to be wired together by hand.'},
{y:'1948',n:'Manchester "Baby"',s:'The first machine to run a stored program from electronic memory (June 1948).',i:'Tiny memory (32 words), held on cathode-ray tubes that were temperamental.'},
{y:'1958–59',n:'Integrated circuit',s:'Jack Kilby (Texas Instruments, 1958) and Robert Noyce (Fairchild, 1959): make many parts and their wires together on one piece of semiconductor.',i:'Demanded ever finer manufacturing. As density grew, removing heat became a limit.'},
{y:'1964',n:'IBM System/360',s:'A family of machines of different sizes that all ran the same software, so customers did not have to rewrite programs when upgrading.',i:'Compatibility meant carrying old design decisions forward.'},
{y:'1969',n:'ARPANET first message',s:'Computers at separate sites exchanged data using packet switching.',i:'Different networks used different rules and could not yet talk to each other.'},
{y:'1971',n:'Intel 4004',s:'The first commercial single-chip microprocessor, with about 2,300 transistors: a whole CPU on one chip.',i:'Only 4 bits wide and small by later standards.'},
{y:'1981',n:'IBM PC',s:'An affordable, expandable personal computer made from off-the-shelf parts.',i:'Early system software did not stop one program interfering with another.'},
{y:'1983',n:'TCP/IP adopted on ARPANET',s:'A common set of rules that joined separate networks into one internet (the switch-over took place on 1 January 1983).',i:'Designed for a small, trusted community. Security had to be added later.'},
{y:'1989–91',n:'World Wide Web',s:'Tim Berners-Lee at CERN proposed (1989) and built (1990–91) linked pages, addresses and HTTP on top of the internet.',i:'Pages were open to anyone on the path to read. Encryption (TLS) was added afterwards.'}
];
DEMOS.timeline={note:'Click each machine. Read what it fixed, then what it left unsolved. The unsolved part is the reason the next one exists.',
mount(r){
  let sel=4;
  r.innerHTML=`<div class="grid g2"><div class="tl" id="tl"></div><div class="card" id="det" style="align-self:start;position:sticky;top:12px"></div></div>`;
  const draw=()=>{
    $(r,'#tl').innerHTML=EARLY.map((e,i)=>`<button type="button" aria-pressed="${i===sel}" data-i="${i}"><b>${e.y}</b><span>${esc(e.n)}</span></button>`).join('');
    const e=EARLY[sel];

/* ---- 3. transistor ---- */

/* ---- 4. gates ---- */
const GATES={AND:(a,b)=>a&b,OR:(a,b)=>a|b,NAND:(a,b)=>+!(a&b),NOR:(a,b)=>+!(a|b),XOR:(a,b)=>a^b,XNOR:(a,b)=>+!(a^b),NOT:(a)=>+!a};
const nandF=(a,b)=>+!(a&b);
const NANDONLY={NOT:(a)=>nandF(a,a),AND:(a,b)=>nandF(nandF(a,b),nandF(a,b)),OR:(a,b)=>nandF(nandF(a,a),nandF(b,b)),NAND:(a,b)=>nandF(a,b),
 NOR:(a,b)=>{const o=nandF(nandF(a,a),nandF(b,b));return nandF(o,o)},XOR:(a,b)=>{const m=nandF(a,b);return nandF(nandF(a,m),nandF(b,m))},
 XNOR:(a,b)=>{const m=nandF(a,b);const x=nandF(nandF(a,m),nandF(b,m));return nandF(x,x)}};
const NANDCOUNT={NOT:1,AND:2,OR:3,NAND:1,NOR:4,XOR:4,XNOR:5};
DEMOS.gates={note:'Pick a gate, flip A and B, and watch the highlighted row of its truth table. At the bottom, the same gate is rebuilt using only NAND gates.',
mount(r){
  let gt='AND',a=0,b=0;
  r.innerHTML=`<div class="row" id="gp"></div><div class="row"><button class="btn" id="ab" type="button"></button><button class="btn" id="bb" type="button"></button><span class="pill sig" id="o"></span></div>
  <div class="scroll"><table class="tbl" id="tt"></table></div><div class="msg" id="nm"></div>`;
  const draw=()=>{
    $(r,'#gp').innerHTML=Object.keys(GATES).map(k=>`<button class="btn ${k===gt?'sel':''}" type="button" data-g="${k}">${k}</button>`).join('');
    $$(r,'#gp .btn').forEach(x=>x.onclick=()=>{gt=x.dataset.g;draw()});
    const un=gt==='NOT';
    $(r,'#ab').textContent='A = '+a; $(r,'#bb').textContent='B = '+b; $(r,'#bb').hidden=un;
    const f=GATES[gt]; $(r,'#o').textContent='Output = '+f(a,b);
    const rows=un?[[0],[1]]:[[0,0],[0,1],[1,0],[1,1]];
    $(r,'#tt').innerHTML=`<tr>${un?'<th>A</th>':'<th>A</th><th>B</th>'}<th>Output</th></tr>`+rows.map(x=>`<tr class="${(un?x[0]===a:x[0]===a&&x[1]===b)?'hl':''}">${x.map(v=>`<td>${v}</td>`).join('')}<td>${f(...x)}</td></tr>`).join('');
    const ok=rows.every(x=>NANDONLY[gt](...x)===f(...x));
    $(r,'#nm').innerHTML=`Built from <b>only NAND gates</b> (${NANDCOUNT[gt]} used): output = <b>${NANDONLY[gt](a,b)}</b> ${ok?'<span class="pill good">matches on every row</span>':'<span class="pill bad">mismatch</span>'}`;
  };
  $(r,'#ab').onclick=()=>{a^=1;draw()};$(r,'#bb').onclick=()=>{b^=1;draw()};draw();
}};

/* ---- 5. adder ---- */
DEMOS.adder={note:'Set two 4-bit numbers. Each column is a full adder: sum = A xor B xor carry-in, carry-out passes to the left. Try 15 + 1 to see overflow.',
mount(r){
  let A=[0,1,1,0],B=[0,1,1,1];
  r.innerHTML=`<div class="grid g2"><div><h5>A (click bits)</h5><div class="row" id="ra"></div></div><div><h5>B (click bits)</h5><div class="row" id="rb"></div></div></div><div class="scroll"><table class="tbl" id="cols"></table></div><div class="out" id="res"></div><div id="fl"></div>`;
  const draw=()=>{
    $(r,'#ra').innerHTML=A.map((v,i)=>bitBtn(v,i,2**(3-i))).join('');$(r,'#rb').innerHTML=B.map((v,i)=>bitBtn(v,i,2**(3-i))).join('');
    $$(r,'#ra .bit').forEach(x=>x.onclick=()=>{A[+x.dataset.i]^=1;draw()});$$(r,'#rb .bit').forEach(x=>x.onclick=()=>{B[+x.dataset.i]^=1;draw()});
    let c=0;const sum=[],rows=[];
    for(let i=3;i>=0;i--){const a=A[i],b=B[i],s=a^b^c,co=(a&b)|(c&(a^b));rows.push(`<tr><td>${2**(3-i)}s column</td><td>${a}</td><td>${b}</td><td>${c}</td><td><b>${s}</b></td><td>${co}</td></tr>`);sum[i]=s;c=co}
    $(r,'#cols').innerHTML=`<tr><th>Column</th><th>A</th><th>B</th><th>carry in</th><th>sum</th><th>carry out</th></tr>`+rows.join('');
    const a=parseInt(A.join(''),2),b=parseInt(B.join(''),2);
    $(r,'#res').textContent=`${a} + ${b} → bits ${sum.join('')} = ${parseInt(sum.join(''),2)}   (carry out of the top: ${c})`;
    $(r,'#fl').innerHTML=c?`<div class="msg bad"><b>Overflow.</b> The true answer ${a+b} needs 5 bits. Only 4 are stored, so the stored result is ${parseInt(sum.join(''),2)} and the carry flag is set.</div>`:`<div class="msg good">Fits in 4 bits. Carry flag clear.</div>`;
  };draw();
}};

/* ---- 6. latch ---- */
DEMOS.latch={note:'An SR latch made of two NOR gates feeding each other. Set it, release, and it remembers. Hold both inputs high and see why that input is forbidden.',
mount(r){
  let S=0,R=0,q=0,nq=1,log=[];
  r.innerHTML=`<div class="row"><button class="btn" id="sb" type="button"></button><button class="btn" id="rb" type="button"></button></div>
  <div class="nodes" id="st"></div><div class="msg" id="why"></div><h5>History</h5><div class="log" id="lg"></div>`;
  const settle=()=>{for(let i=0;i<8;i++){const n2=+!(S||q);const q2=+!(R||n2);if(q2===q&&n2===nq)break;q=q2;nq=n2}};
  const draw=()=>{
    $(r,'#sb').textContent='Set input S = '+S;$(r,'#rb').textContent='Reset input R = '+R;
    $(r,'#st').innerHTML=`<div class="node ${q?'lit':''}">Q = ${q}</div><div class="node ${nq?'lit':''}">not-Q = ${nq}</div>`;
    $(r,'#why').innerHTML=(S&&R)?'<b>Forbidden.</b> Both gates are forced to output 0, so Q and not-Q are no longer opposites. When both inputs are released together, which state it settles into depends on tiny timing differences. Real designs never allow this input.':(S?'S high forces not-Q low, which lets Q go high.':(R?'R high forces Q low, which lets not-Q go high.':`Both inputs low: the loop keeps its last value (Q = ${q}). <b>This is memory.</b>`));
    $(r,'#lg').innerHTML=log.slice(-8).map(x=>`<div>${x}</div>`).join('')||'<div>(change an input)</div>';
  };
  const tog=k=>{if(k==='S')S^=1;else R^=1;settle();log.push(`S=${S} R=${R} → Q=${q}`);draw()};
  $(r,'#sb').onclick=()=>tog('S');$(r,'#rb').onclick=()=>tog('R');draw();
}};

/* ---- 7. clock ---- */
DEMOS.clock={note:'A flip-flop copies D to Q only at the rising edge of the clock. Change D as often as you like: Q waits for the tick. Below, see how short a tick really is.',
mount(r){
  let D=0,Q=0,n=0,hD='',hQ='',hC='',auto=null;
  r.innerHTML=`<div class="row"><button class="btn" id="db" type="button"></button><button class="btn pri" id="tk" type="button">Tick (one clock cycle)</button><label><input type="checkbox" id="au"> auto-tick</label></div>
  <div class="grid g3"><div class="reg"><b>D (input)</b><span id="vd"></span></div><div class="reg"><b>Q (stored)</b><span id="vq"></span></div><div class="reg"><b>4-bit counter</b><span id="vn"></span></div></div>
  <div class="out" id="wave"></div>
  <div><h5>How long is a tick?</h5><div class="row"><input type="range" id="gh" min="0.5" max="6" step="0.5" value="3" aria-label="clock speed in GHz"><span id="gv"></span></div><p class="demo-note" id="gt"></p></div>`;
  const draw=()=>{
    $(r,'#db').textContent='Change D (now '+D+')';$(r,'#vd').textContent=D;$(r,'#vq').textContent=Q;$(r,'#vn').textContent=bin(n,4);
    $(r,'#wave').textContent=`CLK ${hC}\nD   ${hD}\nQ   ${hQ}`;
  };
  const tick=()=>{Q=D;n=(n+1)&15;hC=(hC+'▁▔')  .slice(-24);hD=(hD+(D?'▔▔':'▁▁')).slice(-24);hQ=(hQ+(Q?'▔▔':'▁▁')).slice(-24);draw()};
  $(r,'#db').onclick=()=>{D^=1;draw()};$(r,'#tk').onclick=tick;
  $(r,'#au').onchange=e=>{clearInterval(auto);if(e.target.checked)auto=setInterval(tick,700)};onLeave(()=>clearInterval(auto));
  const ghz=()=>{const g=+$(r,'#gh').value;$(r,'#gv').textContent=g+' GHz';const ns=1/g;const cm=29.98*ns;$(r,'#gt').textContent=`One tick lasts ${(ns*1000).toFixed(0)} picoseconds (${ns.toFixed(2)} ns). In that time light in a vacuum travels at most ${cm.toFixed(1)} cm. Real signals on a chip are slower, so the parts that must agree within one tick have to be close together.`};
  $(r,'#gh').oninput=ghz;draw();ghz();
}};

/* ---- 8. register file ---- */
function aluCalc(op,a,b){
  let t,r;
  switch(op){
    case 'ADD':t=a+b;r=t&255;return{r,Z:+(r===0),N:r>>7,C:+(t>255),V:+(((a^r)&(b^r)&128)!==0)};
    case 'SUB':t=a-b;r=t&255;return{r,Z:+(r===0),N:r>>7,C:+(a<b),V:+(((a^b)&(a^r)&128)!==0)};
    case 'AND':r=a&b;break;case 'OR':r=a|b;break;case 'XOR':r=a^b;break;
    case 'SHL':t=a<<1;r=t&255;return{r,Z:+(r===0),N:r>>7,C:(t>255)?1:0,V:0};
    case 'SHR':r=a>>1;return{r,Z:+(r===0),N:0,C:a&1,V:0};
  }
  return{r,Z:+(r===0),N:r>>7,C:0,V:0};
}
DEMOS.regfile={note:'Four 8-bit registers. Pick an instruction and run it. Every instruction here takes about one clock cycle because everything is inside the CPU.',
mount(r){
  const R=[0,0,0,0];let Z=0,Nf=0,C=0,hl=-1,log=[];
  const ops=['MOVI','MOV','ADD','SUB','AND','XOR','SHL','INC'];
  r.innerHTML=`<div class="row" id="regs"></div><div class="row"><select id="op" aria-label="instruction">${ops.map(o=>`<option>${o}</option>`).join('')}</select>
  <label>dest <select id="rd">${[0,1,2,3].map(i=>`<option>R${i}</option>`).join('')}</select></label>
  <label id="ls">source <select id="rs">${[0,1,2,3].map(i=>`<option>R${i}</option>`).join('')}</select></label>
  <label id="li">value <input type="number" id="im" value="7" min="0" max="255" style="width:5em"></label>
  <button class="btn pri" id="go" type="button">Run</button><button class="btn" id="rz" type="button">Reset</button></div>
  <div class="row" id="fl"></div><div class="log" id="lg"></div>`;
  const draw=()=>{
    $(r,'#regs').innerHTML=R.map((v,i)=>`<div class="reg ${hl===i?'hl':''}"><b>R${i}</b><span>${v}</span><div class="mono" style="font-size:.7rem;color:var(--ink2)">${bin(v)}</div></div>`).join('');
    $(r,'#fl').innerHTML=`<span class="pill ${Z?'sig':''}">Z zero ${Z}</span><span class="pill ${Nf?'sig':''}">N negative-looking ${Nf}</span><span class="pill ${C?'sig':''}">C carry ${C}</span>`;
    const op=$(r,'#op').value;$(r,'#ls').hidden=!['MOV','ADD','SUB','AND','XOR'].includes(op);$(r,'#li').hidden=op!=='MOVI';
    $(r,'#lg').innerHTML=log.slice(-6).map(x=>`<div>${x}</div>`).join('')||'<div>(run an instruction)</div>';
  };
  $(r,'#op').onchange=draw;
  $(r,'#go').onclick=()=>{
    const op=$(r,'#op').value,d=+$(r,'#rd').value.slice(1),s=+$(r,'#rs').value.slice(1),im=Math.max(0,Math.min(255,+$(r,'#im').value||0));
    let txt;
    if(op==='MOVI'){R[d]=im;txt=`MOVI R${d}, ${im}`}
    else if(op==='MOV'){R[d]=R[s];txt=`MOV R${d}, R${s}`}
    else if(op==='SHL'){const x=aluCalc('SHL',R[d],0);R[d]=x.r;Z=x.Z;Nf=x.N;C=x.C;txt=`SHL R${d}  (double it)`}
    else if(op==='INC'){const x=aluCalc('ADD',R[d],1);R[d]=x.r;Z=x.Z;Nf=x.N;C=x.C;txt=`INC R${d}`}
    else{const x=aluCalc(op,R[d],R[s]);R[d]=x.r;Z=x.Z;Nf=x.N;C=x.C;txt=`${op} R${d}, R${s}`}
    hl=d;log.push(`${txt}  → R${d} = ${R[d]}   (1 cycle)`);draw();
  };
  $(r,'#rz').onclick=()=>{R.fill(0);Z=Nf=C=0;hl=-1;log=[];draw()};draw();
}};

/* ---- 9. alu ---- */
DEMOS.alu={note:'Choose two 8-bit numbers and an operation. The ALU returns a result plus flags. Try 200 + 100, then 5 − 9, then 127 + 1 and read the flags.',
mount(r){
  let op='ADD';
  r.innerHTML=`<div class="row"><label>A <input type="number" id="a" min="0" max="255" value="200" style="width:5.5em"></label><label>B <input type="number" id="b" min="0" max="255" value="100" style="width:5.5em"></label></div>
  <div class="row" id="ops"></div><div class="grid g2"><div><h5>Result bits</h5><div class="out" id="rb"></div></div><div><h5>Same bits, two readings</h5><div class="out" id="rd"></div></div></div><div class="row" id="fl"></div><div class="msg" id="ex"></div>`;
  const draw=()=>{
    $(r,'#ops').innerHTML=['ADD','SUB','AND','OR','XOR','SHL','SHR'].map(o=>`<button class="btn ${o===op?'sel':''}" type="button" data-o="${o}">${o}</button>`).join('');
    $$(r,'#ops .btn').forEach(x=>x.onclick=()=>{op=x.dataset.o;draw()});
    const a=Math.max(0,Math.min(255,Math.floor(+$(r,'#a').value||0))),b=Math.max(0,Math.min(255,Math.floor(+$(r,'#b').value||0)));
    const x=aluCalc(op,a,b),sg=n=>n>127?n-256:n;
    $(r,'#rb').textContent=`${bin(a)} ${op} ${bin(b)}\n= ${bin(x.r)}`;
    $(r,'#rd').textContent=`unsigned: ${x.r}\nsigned (two's complement): ${sg(x.r)}`;
    $(r,'#fl').innerHTML=[['Z','result is zero',x.Z],['N','top bit set',x.N],['C','carry / borrow',x.C],['V','signed overflow',x.V]].map(f=>`<span class="pill ${f[2]?'sig':''}">${f[0]} ${f[2]} · ${f[1]}</span>`).join('');
    let ex='';
    if(op==='ADD')ex=x.C?'The sum is above 255, so a ninth bit fell off. That is the carry flag.':(x.V?'Treated as signed numbers, two positives gave a negative-looking result. That is signed overflow.':'The sum fits.');
    if(op==='SUB')ex=`Subtraction is done as A + (flip all bits of B) + 1. ${x.C?'A is smaller than B, so it borrowed (carry flag set); read as signed, the answer is '+sg(x.r)+'.':'No borrow needed.'}`;
    if(op==='SHL')ex='Shifting left moves every bit one place up, which doubles the number (the top bit falls into carry).';
    if(op==='SHR')ex='Shifting right halves the number, dropping the lowest bit into carry.';
    if(['AND','OR','XOR'].includes(op))ex='Each of the 8 columns is a separate logic gate. There is no carry between them.';
    $(r,'#ex').textContent=ex;
  };
  $(r,'#a').oninput=draw;$(r,'#b').oninput=draw;draw();
}};

/* ---- 10. cpu ---- */
DEMOS.cpu={note:'A tiny CPU running a real loop: it adds n + (n−1) + … + 1 into memory cell 12. Press Step to move one phase at a time and read what is happening.',
mount(r){
  const PROG=[['LOAD',12],['ADD',13],['STORE',12],['LOAD',13],['SUB',14],['STORE',13],['JNZ',0],['HALT',0]];
  const NAMES=['sum += n: copy memory[12] to ACC','…add memory[13] (n)','…write ACC back to memory[12]','copy n into ACC','subtract 1 (memory[14])','write n−1 back','if ACC is not 0, jump to line 0','stop'];
  let s;
  const reset=()=>{s={pc:0,acc:0,ir:null,irTxt:'—',ph:0,halt:false,cyc:0,mem:[...PROG.map(p=>p.slice()),0,0,0,0,0,0,0,0].slice(0,16),msg:'Press Step. PC is 0, so the first thing to do is fetch the instruction at address 0.',row:-1,data:-1,};
    s.mem[12]=0;s.mem[13]=+$(r,'#n').value||5;s.mem[14]=1;s.mem[15]=0;};
  r.innerHTML=`<div class="row"><label>n = <input type="number" id="n" value="5" min="1" max="20" style="width:5em"></label><button class="btn pri" id="st" type="button">Step</button><button class="btn" id="ins" type="button">Whole instruction</button><button class="btn" id="run" type="button">Run / pause</button><button class="btn" id="rs" type="button">Reset</button></div>
  <div class="row" id="regs"></div><div class="msg sig" id="msg" role="status"></div><div class="scroll"><table class="tbl" id="mem"></table></div>`;
  const opDesc={LOAD:'copy a value from memory into ACC',ADD:'add a memory value to ACC (ALU)',SUB:'subtract a memory value from ACC (ALU)',STORE:'write ACC into memory',JNZ:'if ACC is not zero, put the address into PC',HALT:'stop'};
  const draw=()=>{
    $(r,'#regs').innerHTML=`<div class="reg ${s.ph===0&&!s.halt?'hl':''}"><b>PC</b><span>${s.pc}</span></div><div class="reg ${s.ph===1?'hl':''}"><b>IR</b><span>${esc(s.irTxt)}</span></div><div class="reg ${s.ph===2?'hl':''}"><b>ACC</b><span>${s.acc}</span></div><div class="reg"><b>NEXT PHASE</b><span>${s.halt?'halted':['FETCH','DECODE','EXECUTE'][s.ph]}</span></div><div class="reg"><b>CYCLES</b><span>${s.cyc}</span></div>`;
    $(r,'#msg').textContent=s.msg;
    let h='<tr><th>addr</th><th>content</th><th>note</th></tr>';
    for(let i=0;i<16;i++){const c=i<8?`${s.mem[i][0]} ${s.mem[i][0]==='HALT'?'':s.mem[i][1]}`:s.mem[i];const note=i<8?NAMES[i]:(i===12?'sum (the answer)':i===13?'n (counts down)':i===14?'constant 1':'');
      h+=`<tr class="${i===s.row||i===s.data?'hl':''}"><td>${i}${i===s.pc&&!s.halt?' ◀ PC':''}</td><td>${c}</td><td>${note}</td></tr>`}
    $(r,'#mem').innerHTML=h;
    $(r,'#st').disabled=$(r,'#ins').disabled=s.halt;
  };
  const step=()=>{
    if(s.halt)return;
    if(s.ph===0){s.row=s.pc;s.data=-1;s.ir=s.mem[s.pc];s.irTxt=s.ir[0]+(s.ir[0]==='HALT'?'':' '+s.ir[1]);s.msg=`FETCH: the PC says ${s.pc}, so the instruction at address ${s.pc} (${s.irTxt}) is copied into IR. PC then moves on to ${s.pc+1}.`;s.pc++;s.ph=1}
    else if(s.ph===1){const [op,ar]=s.ir;s.msg=`DECODE: the opcode ${op} means "${opDesc[op]}".${op==='HALT'?'':' The operand is address '+ar+'.'} The control unit now opens the right paths.`;s.ph=2}
    else{const [op,ar]=s.ir;s.data=op==='JNZ'||op==='HALT'?-1:ar;let m='';
      if(op==='LOAD'){s.acc=s.mem[ar];m=`ACC ← memory[${ar}] = ${s.acc}`}
      else if(op==='ADD'){s.acc=(s.acc+s.mem[ar])&255;m=`ALU adds memory[${ar}] (${s.mem[ar]}) to ACC → ${s.acc}`}
      else if(op==='SUB'){s.acc=(s.acc-s.mem[ar])&255;m=`ALU subtracts memory[${ar}] (${s.mem[ar]}) from ACC → ${s.acc}`}
      else if(op==='STORE'){s.mem[ar]=s.acc;m=`memory[${ar}] ← ACC = ${s.acc}`}
      else if(op==='JNZ'){if(s.acc!==0){s.pc=ar;m=`ACC is ${s.acc}, not zero, so PC ← ${ar}. This is a loop: nothing special, just a changed PC.`}else m='ACC is 0, so the jump is skipped and the loop ends.'}
      else{s.halt=true;m=`HALT. The answer is in memory[12] = ${s.mem[12]}.`}
      s.msg='EXECUTE: '+m;s.ph=0;s.cyc++}
    draw();
  };
  let timer=null;
  $(r,'#st').onclick=step;$(r,'#ins').onclick=()=>{do{step()}while(s.ph!==0&&!s.halt)};
  $(r,'#run').onclick=()=>{if(timer){clearInterval(timer);timer=null}else timer=setInterval(()=>{if(s.halt){clearInterval(timer);timer=null}else step()},350)};
  onLeave(()=>clearInterval(timer));
  $(r,'#rs').onclick=()=>{clearInterval(timer);timer=null;reset();draw()};$(r,'#n').onchange=$(r,'#rs').onclick;
  s={};reset();draw();
}};
/* ---- memory ---- */
function human(sec){
  if(sec<1)return '< 1 second';
  const u=[['year',31557600],['day',86400],['hour',3600],['minute',60],['second',1]];
  for(const [n,s] of u){ if(sec>=s){ const v=sec/s; return (v>=10?Math.round(v):v.toFixed(1))+' '+n+(Math.abs(v-1)<0.05?'':'s'); } }
}

  <div class="blocks" id="bk"></div><div class="row" id="fl"></div><div class="scroll"><table class="tbl" id="tb"></table></div><div class="msg" id="nt"></div>`;

    $(r,'#fl').innerHTML=Object.keys(files).map(n=>`<button class="btn" type="button" data-d="${n}">Delete ${n}</button>`).join('');

    const runs=bl=>{let c=1;for(let i=1;i<bl.length;i++)if(bl[i]!==bl[i-1]+1)c++;return c};
    $(r,'#tb').innerHTML='<tr><th>name</th><th>blocks (in order)</th><th>pieces</th></tr>'+Object.keys(files).map(n=>`<tr><td>${n}</td><td>${files[n].join(', ')}</td><td>${runs(files[n])}</td></tr>`).join('');
    const frag=Object.values(files).some(b=>runs(b)>1);
    $(r,'#nt').innerHTML=frag?'<b>Fragmented.</b> A file in several pieces is no problem for the table, but a hard disk must move its arm for each piece (milliseconds each). An SSD has no arm, so it barely cares.':'Every file is in one piece. Delete a middle file, then add a larger one to see fragmentation.';
  };

  $(r,'#rs').onclick=()=>{disk=Array(32).fill(null);files={};next=0;add(3);add(4);add(3);add(2);draw()};

/* ---- compile ---- */
function tokenize(s){const t=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const n=parseFloat(s.slice(i,j));if(isNaN(n))throw new Error('bad number "'+s.slice(i,j)+'"');t.push({k:'num',v:n});i=j}else if('+-*/()'.includes(c)){t.push({k:'op',v:c});i++}else throw new Error('unknown symbol "'+c+'"')}return t}
function parseExpr(tk){let p=0;
  const peek=()=>tk[p],eat=()=>tk[p++];
  const factor=()=>{const t=eat();if(!t)throw new Error('expression ended too soon');if(t.k==='num')return{t:'num',v:t.v};if(t.v==='('){const e=expr();const c=eat();if(!c||c.v!==')')throw new Error('missing )');return e}if(t.v==='-')return{t:'neg',e:factor()};throw new Error('unexpected "'+t.v+'"')};
  const term=()=>{let l=factor();while(peek()&&(peek().v==='*'||peek().v==='/')){const o=eat().v;l={t:'bin',op:o,l,r:factor()}}return l};
  const expr=()=>{let l=term();while(peek()&&(peek().v==='+'||peek().v==='-')){const o=eat().v;l={t:'bin',op:o,l,r:term()}}return l};
  const e=expr();if(p<tk.length)throw new Error('unexpected "'+tk[p].v+'"');return e}
const genCode=(n,o=[])=>{if(n.t==='num')o.push(['PUSH',n.v]);else if(n.t==='neg'){genCode(n.e,o);o.push(['NEG'])}else{genCode(n.l,o);genCode(n.r,o);o.push([{'+':'ADD','-':'SUB','*':'MUL','/':'DIV'}[n.op]])}return o};
const treeTxt=(n,d=0)=>{const pad='  '.repeat(d);if(n.t==='num')return pad+n.v+'\n';if(n.t==='neg')return pad+'negate\n'+treeTxt(n.e,d+1);return pad+n.op+'\n'+treeTxt(n.l,d+1)+treeTxt(n.r,d+1)};
DEMOS.compile={note:'Type an arithmetic expression. See it become tokens, a tree, then stack-machine instructions, then run it step by step.',
mount(r){
  let k=0,code=[];
  r.innerHTML=`<input type="text" id="ex" value="2 + 3 * 4" aria-label="expression" style="width:min(100%,24em)"><div class="msg bad" id="er" hidden></div>
  <div class="grid g2"><div><h5>1 · Tokens</h5><div class="out" id="tk"></div></div><div><h5>2 · Tree (what is inside what)</h5><div class="out" id="tr"></div></div></div>
  <div class="grid g2"><div><h5>3 · Instructions</h5><div class="out" id="cd"></div></div><div><h5>4 · Running on a stack <button class="btn" id="sp" type="button">Step</button> <button class="btn" id="sr" type="button">Restart</button></h5><div class="out" id="rn"></div></div></div>`;
  const run=()=>{
    const er=$(r,'#er');er.hidden=true;
    try{const tk=tokenize($(r,'#ex').value);if(!tk.length)throw new Error('type something');const ast=parseExpr(tk);code=genCode(ast);k=0;
      $(r,'#tk').textContent=tk.map(t=>t.k==='num'?`NUM(${t.v})`:`'${t.v}'`).join('  ');$(r,'#tr').textContent=treeTxt(ast);
      $(r,'#cd').textContent=code.map((c,i)=>`${i}: ${c.join(' ')}`).join('\n');show()}
    catch(e){er.hidden=false;er.textContent='Cannot translate: '+e.message}
  };
  const show=()=>{let st=[];const ln=[];for(let i=0;i<k&&i<code.length;i++){const [op,v]=code[i];if(op==='PUSH')st.push(v);else if(op==='NEG')st.push(-st.pop());else{const b=st.pop(),a=st.pop();st.push(op==='ADD'?a+b:op==='SUB'?a-b:op==='MUL'?a*b:a/b)}ln.push(`${code[i].join(' ')}  → stack [${st.join(', ')}]`)}
    $(r,'#rn').textContent=(ln.join('\n')||'(press Step)')+(k>=code.length?`\n\nResult: ${st[0]}`:'');$(r,'#sp').disabled=k>=code.length};
  $(r,'#ex').oninput=run;$(r,'#sp').onclick=()=>{k++;show()};$(r,'#sr').onclick=()=>{k=0;show()};run();
}};

  <div class="row"><button class="btn" data-m="fifo" type="button">One after another</button><button class="btn" data-m="rr" type="button">Round robin (turns)</button><label>Turn length <input type="range" id="q" min="1" max="8" value="2" aria-label="turn length"> <b id="qv"></b></label></div>
  <div class="blocks" id="g" style="grid-template-columns:repeat(auto-fill,minmax(1.4rem,1fr))"></div><div class="row" id="m"></div><div class="msg" id="nt"></div>`;

    $(r,'#g').innerHTML=tl.map(i=>`<div class="blk" style="background:${col[i]};color:#10202a;border-color:transparent">P${i+1}</div>`).join('');

/* ---- virtual memory ---- */
DEMOS.vm={note:'A 16-bit address space with 4 KB pages (16 virtual pages) and only 4 real frames. Access pages and watch the table change. When memory is full the least recently used page is evicted.',
mount(r){
  let pt=Array(16).fill(null),lru=[],log=[],last=null,faults=0,hits=0,free=[0,1,2,3];
  r.innerHTML=`<div class="row"><label>Virtual address (hex) <input type="text" id="va" value="3A7C" maxlength="4" style="width:6em" aria-label="virtual address in hex"></label><button class="btn pri" id="go" type="button">Translate / access</button><button class="btn" id="rs" type="button">Reset</button></div>
  <p class="demo-note">Or touch a whole page by number:</p><div class="row" id="pg"></div><div class="msg sig" id="tr" role="status"></div><div class="grid g2"><div class="scroll"><table class="tbl" id="pt"></table></div><div><h5>Real RAM frames</h5><div class="row" id="fr"></div></div></div><div class="row" id="st"></div><div class="log" id="lg"></div>`;
  $(r,'#pg').innerHTML=Array.from({length:16},(_,i)=>`<button class="btn" type="button" data-p="${i}">${i}</button>`).join('');
  const access=(addr)=>{
    const p=addr>>12,off=addr&0xfff;let msg=`Virtual 0x${addr.toString(16).toUpperCase().padStart(4,'0')} = page ${p} (top 4 bits), offset 0x${off.toString(16).toUpperCase().padStart(3,'0')} (low 12 bits). `;
    if(pt[p]===null){faults++;let f;if(free.length)f=free.shift();else{const v=lru.shift();f=pt[v];pt[v]=null;msg+=`PAGE FAULT: no free frame, OS evicts page ${v} (least recently used) from frame ${f}. `}pt[p]=f;msg+=`PAGE FAULT: page ${p} was not in RAM. The OS loads it into frame ${f}, then retries. `}else{hits++;msg+='Page already mapped. '}
    lru=lru.filter(x=>x!==p);lru.push(p);const phys=pt[p]*4096+off;msg+=`Physical address = frame ${pt[p]} × 4096 + offset = 0x${phys.toString(16).toUpperCase().padStart(5,'0')}.`;
    last=p;log.push(msg);draw();
  };
  const draw=()=>{
    $(r,'#tr').textContent=log.length?log[log.length-1]:'Nothing accessed yet. Every page starts unmapped.';
    $(r,'#pt').innerHTML='<tr><th>virtual page</th><th>frame</th></tr>'+pt.map((f,i)=>f===null?null:`<tr class="${i===last?'hl':''}"><td>${i}</td><td>${f}</td></tr>`).filter(Boolean).join('')||'<tr><td colspan="2">(empty)</td></tr>';
    const owner=[0,1,2,3].map(f=>pt.findIndex(x=>x===f));
    $(r,'#fr').innerHTML=owner.map((p,f)=>`<div class="reg ${p>=0&&p===last?'hl':''}"><b>FRAME ${f}</b><span>${p>=0?'page '+p:'free'}</span></div>`).join('');
    $(r,'#st').innerHTML=`<span class="pill good">already mapped ${hits}</span><span class="pill bad">page faults ${faults}</span>`;
    $(r,'#lg').innerHTML=log.slice(-5).map(x=>`<div>${x}</div>`).join('')||'<div>(no accesses yet)</div>';
  };
  $(r,'#go').onclick=()=>{const v=parseInt($(r,'#va').value,16);if(isNaN(v)||v<0||v>0xffff){$(r,'#tr').textContent='Enter 1 to 4 hex digits (0000 to FFFF).';return}access(v)};
  $$(r,'[data-p]').forEach(b=>b.onclick=()=>access(+b.dataset.p*4096+0x123));
  $(r,'#rs').onclick=()=>{pt=Array(16).fill(null);lru=[];log=[];last=null;faults=hits=0;free=[0,1,2,3];draw()};draw();
}};

/* ---- race ---- */
DEMOS.race={note:'The balance is 100. Task A deposits 50. Task B withdraws 30. Each does READ, COMPUTE, WRITE. You choose which task moves next. Try: A reads, B reads, A writes, B writes.',
mount(r){
  let bal,A,B,lock,log;
  const reset=()=>{bal=100;A={pc:0,reg:0,name:'A',d:50};B={pc:0,reg:0,name:'B',d:-30};lock=null;log=[]};reset();
  r.innerHTML=`<label><input type="checkbox" id="lk"> Use a lock around READ…WRITE</label>
  <div class="row"><div class="reg"><b>BALANCE (shared)</b><span id="bal"></span></div><div class="reg" id="ra"></div><div class="reg" id="rb"></div><div class="reg"><b>LOCK HELD BY</b><span id="lh"></span></div></div>
  <div class="row"><button class="btn pri" id="sa" type="button"></button><button class="btn pri" id="sb" type="button"></button><button class="btn" id="rs" type="button">Reset</button></div>
  <div class="msg" id="res" role="status"></div><div class="log" id="lg"></div>
  <div><h5>Run 2000 random orders</h5><div class="row"><button class="btn" id="mc" type="button">Simulate</button><span id="mcr" class="mono"></span></div></div>`;
  const labels=['READ balance','COMPUTE new value','WRITE balance','(finished)'];
  const stepT=(T,useLock)=>{
    if(T.pc>=3)return false;
    if(T.pc===0&&useLock){if(lock&&lock!==T.name)return false;lock=T.name}
    if(T.pc===0){T.reg=bal;log.push(`${T.name}: READ → sees ${bal}`)}
    else if(T.pc===1){T.reg+=T.d;log.push(`${T.name}: COMPUTE → ${T.reg}`)}
    else{bal=T.reg;log.push(`${T.name}: WRITE → balance is now ${bal}`);if(useLock)lock=null}

  };

    const ul=$(r,'#lk').checked;

    const canA=A.pc<3&&!(ul&&A.pc===0&&lock&&lock!=='A'),canB=B.pc<3&&!(ul&&B.pc===0&&lock&&lock!=='B');
    $(r,'#sa').textContent=A.pc>=3?'A finished':(canA?'Run A: '+labels[A.pc]:'A waits for lock');$(r,'#sa').disabled=!canA;
    $(r,'#sb').textContent=B.pc>=3?'B finished':(canB?'Run B: '+labels[B.pc]:'B waits for lock');$(r,'#sb').disabled=!canB;
    const fin=A.pc>=3&&B.pc>=3;
    $(r,'#res').className='msg '+(fin?(bal===120?'good':'bad'):'');
    $(r,'#res').innerHTML=fin?(bal===120?'<b>Correct: 120.</b> Both changes survived.':`<b>Wrong: ${bal}.</b> It should be 120. One update was overwritten (a lost update).`):'Expected final balance: 100 + 50 − 30 = 120.';
    $(r,'#lg').innerHTML=log.map(x=>`<div>${x}</div>`).join('')||'<div>(nothing run yet)</div>';
  };
  $(r,'#sa').onclick=()=>{stepT(A,$(r,'#lk').checked);draw()};$(r,'#sb').onclick=()=>{stepT(B,$(r,'#lk').checked);draw()};
  $(r,'#rs').onclick=()=>{reset();draw()};$(r,'#lk').onchange=()=>{reset();draw()};
  $(r,'#mc').onclick=()=>{
    const ul=$(r,'#lk').checked;let wrong=0;const N=2000;

    reset();draw();$(r,'#mcr').textContent=`${wrong} of ${N} runs ended wrong ${ul?'(with the lock)':'(no lock)'}`;
  };
  draw();
}};

DEMOS.packets={note:'Part 1: type a message and see the envelopes wrapped around it. Part 2: send it through a lossy network and watch the sender resend what is missing.',
mount(r){
  r.innerHTML=`<div><h5>1 · Encapsulation</h5><input type="text" id="msg" value="Hello, world" maxlength="60" aria-label="message" style="width:min(100%,24em)">
  <div id="enc" style="margin-top:10px"></div></div>
  <div><h5>2 · Cutting into packets and surviving loss</h5><div class="row"><label>Bytes per packet <input type="range" id="sz" min="2" max="12" value="4"> <b id="szv"></b></label><label>Loss rate <input type="range" id="lo" min="0" max="70" value="30"> <b id="lov"></b>%</label><button class="btn pri" id="snd" type="button">Send</button></div>
  <div class="row" id="pk" style="margin-top:8px"></div><div class="log" id="lg"></div><div class="out" id="rc"></div></div>`;
  const box=(t,body,c)=>`<div style="border:2px solid ${c};border-radius:8px;padding:8px 10px;background:var(--surface)"><div class="mono" style="font-size:.75rem;color:var(--ink2);margin-bottom:6px">${t}</div>${body}</div>`;
  const draw=()=>{
    const m=esc($(r,'#msg').value);
    $(r,'#enc').innerHTML=box('LINK header: from aa:bb:cc:00:00:01 → to the next device on this cable (changes at every hop)',
      box('IP header: from 192.168.1.20 → to 203.0.113.7 (example addresses)',
        box('TCP header: from port 51734 → to port 443, sequence number 1',
          box('Application data (HTTP)',`<span class="mono">GET /hello HTTP/1.1 … ${m}</span>`,'var(--accent)'),'var(--signal)'),'var(--ink2)'),'var(--line)');
    $(r,'#szv').textContent=$(r,'#sz').value;$(r,'#lov').textContent=$(r,'#lo').value;
  };
  $(r,'#msg').oninput=draw;$(r,'#sz').oninput=draw;$(r,'#lo').oninput=draw;
  $(r,'#snd').onclick=()=>{
    const text=$(r,'#msg').value||'x',n=+$(r,'#sz').value,loss=+$(r,'#lo').value/100;
    const ps=[];for(let i=0;i<text.length;i+=n)ps.push({seq:i+1,data:text.slice(i,i+n),ack:false});
    let round=0,tx=0,lg=[];
    while(ps.some(p=>!p.ack)&&round<40){round++;const sent=ps.filter(p=>!p.ack);const res=sent.map(p=>{tx++;const lost=Math.random()<loss;if(!lost)p.ack=true;return `#${p.seq}${lost?' ✗ lost':' ✓'}`});lg.push(`Round ${round}: sent ${res.join('  ')}`)}
    $(r,'#pk').innerHTML=ps.map(p=>`<div class="reg ${p.ack?'':'hl'}"><b>SEQ ${p.seq}</b><span class="mono">${esc(JSON.stringify(p.data))}</span></div>`).join('');
    $(r,'#lg').innerHTML=lg.map(x=>`<div>${x}</div>`).join('');
    $(r,'#rc').textContent=ps.every(p=>p.ack)?`Receiver puts packets in order → "${ps.map(p=>p.data).join('')}"  (${ps.length} packets, ${tx} transmissions, ${round} rounds)`:'Gave up after 40 rounds (loss too high).';
  };
  draw();
}};

/* ---- crypto ---- */
async function sha256hex(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0x811c9dc5;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return 'fallback-' + h.toString(16).padStart(8,'0')}
}
const popc=x=>{let c=0;while(x){c+=x&1;x>>=1}return c};
function modpow(b,e,m){b=BigInt(b);e=BigInt(e);m=BigInt(m);let r=1n;b%=m;while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r}
DEMOS.crypto={note:'Part 1: change one letter and compare the SHA-256 fingerprints. Part 2: a toy public-key pair using tiny numbers.',
mount(r){
  r.innerHTML=`<div><h5>1 · Hash</h5><div class="grid g2"><input type="text" id="t1" value="pay Sam 100" aria-label="first text"><input type="text" id="t2" value="pay Sam 900" aria-label="second text"></div>
  <div class="out" id="h1"></div><div class="out" id="h2"></div><div class="msg" id="df"></div></div>
  <div><h5>2 · Toy public-key pair (n = 3233 from primes 61 × 53; public e = 17; private d = 2753)</h5>
  <div class="row"><label>Message number (0–3232) <input type="number" id="m" min="0" max="3232" value="65" style="width:6em"></label><button class="btn pri" id="en" type="button">Lock with public key</button></div>
  <div class="out" id="ct"></div><div class="row"><label>Unlock with key d = <input type="number" id="dk" value="2753" style="width:6em"></label><button class="btn" id="de" type="button">Unlock</button></div><div class="out" id="pt"></div>
  <p class="demo-note">Real keys use numbers hundreds of digits long, which makes finding the two primes from n impractical. With n = 3233 anyone can factor it in an instant, so this is only for seeing the mechanics.</p></div>`;
  const upd=async()=>{const a=await sha256hex($(r,'#t1').value),b=await sha256hex($(r,'#t2').value);
    $(r,'#h1').textContent=a;$(r,'#h2').textContent=b;
    if(a.length===64&&b.length===64){let d=0;for(let i=0;i<64;i++)d+=popc(parseInt(a[i],16)^parseInt(b[i],16));$(r,'#df').innerHTML=a===b?'Identical input gives an identical fingerprint.':`<b>${d} of 256 bits differ</b> (about half is typical), though the inputs are almost the same. Nothing about the fingerprint hints at the input.`}
    else $(r,'#df').textContent='SHA-256 is not available here, so a simple 32-bit fallback hash is shown.'};
  $(r,'#t1').oninput=upd;$(r,'#t2').oninput=upd;upd();
  let c=null;
  $(r,'#en').onclick=()=>{const m=Math.max(0,Math.min(3232,Math.floor(+$(r,'#m').value||0)));c=modpow(m,17,3233);$(r,'#ct').textContent=`${m}^17 mod 3233 = ${c}`};
  $(r,'#de').onclick=()=>{if(c===null){$(r,'#pt').textContent='Lock a message first.';return}const d=Math.max(1,Math.floor(+$(r,'#dk').value||1));const p=modpow(c,d,3233);$(r,'#pt').textContent=`${c}^${d} mod 3233 = ${p}   ${d===2753?'(correct private key: the original comes back)':'(wrong key: garbage)'}`};
}};

/* ---- tracer ---- */
function tracer(root,cfg){
  let si=0,k=0,flags={};
  root.innerHTML=`<div class="row" id="sc"></div><div class="row" id="fg"></div><div class="nodes" id="nd"></div><div id="ex"></div><div id="cur"></div><div class="row"><button class="btn" id="bk" type="button">Back</button><button class="btn pri" id="nx" type="button">Next step</button><span class="pill" id="ct"></span></div><div id="all" class="grid" style="gap:8px"></div>`;
  const steps=()=>cfg.scenarios[si].build(flags);
  const draw=()=>{
    const sc=cfg.scenarios[si];
    $(root,'#sc').innerHTML=cfg.scenarios.map((s,i)=>`<button class="btn ${i===si?'sel':''}" type="button" data-s="${i}">${esc(s.name)}</button>`).join('');
    $(root,'#fg').innerHTML=(sc.flags||[]).map(f=>`<label><input type="checkbox" data-f="${f.id}" ${flags[f.id]?'checked':''}> ${esc(f.label)}</label>`).join('');
    const S=steps();k=Math.min(k,S.length);
    const cur=k>0?S[k-1]:null;
    $(root,'#nd').innerHTML=cfg.nodes.map(n=>`<div class="node ${cur&&cur.lit&&cur.lit.includes(n[0])?'lit':''} ${cur&&cur.dead&&cur.dead.includes(n[0])?'dead':''}">${esc(n[1])}</div>`).join('');
    $(root,'#cur').innerHTML=cur?`<div class="step"><h5>${esc(cur.t)}</h5><p>${rich(cur.d)}</p></div>`:`<div class="msg">${esc(sc.intro)} Press <b>Next step</b>.</div>`;
    $(root,'#ex').innerHTML=cur&&cur.html?cur.html:'';
    $(root,'#ct').textContent=`step ${k} of ${S.length}`;
    $(root,'#bk').disabled=k===0;$(root,'#nx').disabled=k>=S.length;
    $(root,'#all').innerHTML=S.slice(0,k-1).map((s,i)=>`<div class="mono" style="opacity:.7;font-size:.8rem">${i+1}. ${esc(s.t)}</div>`).join('');
    $$(root,'[data-s]').forEach(b=>b.onclick=()=>{si=+b.dataset.s;k=0;draw()});
    $$(root,'[data-f]').forEach(c=>c.onchange=()=>{flags[c.dataset.f]=c.checked;k=0;draw()});
  };
  $(root,'#nx').onclick=()=>{k++;draw()};$(root,'#bk').onclick=()=>{k--;draw()};
  draw();
}

DEMOS.home={note:'Pick something a person does at home. Step through it. The parts it touches light up in order.',

 scenarios:[
 {name:'Type a letter, then save',intro:'You press the letter "a" in a word processor.',build:()=>[

  {lit:['in','cpu'],t:'Interrupt',d:'The controller raises an [[interrupt]]. The CPU finishes its current [[instruction]], saves where it was, then jumps to the OS routine whose address is in a table.'},
  {lit:['cpu','os','ram'],t:'The OS handler runs',d:'The kernel reads the code, works out which window has focus and puts the key event in that application\'s queue in [[memory]]. Then it returns, and the interrupted work resumes.'},
  {lit:['os','app'],t:'Scheduler wakes the app',d:'The [[scheduler]] gives the application a turn on the CPU. A [[context-switch]] loads its [[register]]s.'},
  {lit:['app','cpu','ram'],t:'The app updates its document',d:'The application\'s code, already translated to [[machine-code]], runs through the fetch-decode-execute cycle. It inserts the letter in its text, which lives in RAM. Recently used data is served by the [[cache]], not the slow trip to RAM.'},
  {lit:['app','os','out'],t:'Redraw',d:'The app asks the OS (a [[syscall]]) to draw. The graphics chip ([[gpu]]) computes the pixels. The screen refreshes, typically 60 times a second, and the "a" appears.'},
  {lit:['app','os','disk'],t:'Save',d:'On Save, the app makes a system call. The [[filesystem]] finds free [[block]]s, writes the content, updates its name-to-block table. Only now would the text survive a power cut, because RAM is [[volatile]].'}]},
 {name:'Open a video site',intro:'You type a web address and press Enter.',flags:[{id:'off',label:'Wi-Fi is off'}],build:(f)=>{

  return s.concat([
  {lit:['net'],t:'Network round trips',d:'Over several [[router]]s the question gets an answer. Then a [[tcp]] [[handshake]] and a [[tls]] handshake set up a reliable, private channel. Each costs a round trip.'},
  {lit:['net','os'],t:'Video arrives as packets',d:'The server sends the video in chunks. Each arriving packet triggers an [[interrupt]]; the OS reassembles [[tcp]] segments in order and passes the bytes to the browser.'},
  {lit:['os','ram','app'],t:'Buffered in RAM',d:'The browser stores the next few seconds of video in RAM so a hiccup in the network does not stop playback.'},
  {lit:['cpu','out'],t:'Decode and draw',d:'The video is compressed. Dedicated decoder hardware (or the CPU) turns it back into frames, and the GPU shows 24 to 60 of them per second.'}])}},
 {name:'Save a photo',intro:'You drag a photo into a folder.',flags:[{id:'pw',label:'Power cut right after "Save"'}],build:(f)=>{
  const s=[{lit:['app','os'],t:'The app asks the OS to write',d:'A [[syscall]] passes the photo\'s bytes from the app\'s memory to the kernel.'},
  {lit:['os','ram'],t:'First into RAM',d:'To stay fast the OS often copies the data into a buffer in [[ram]] and tells the app "done". Writing to storage straight away would make the app wait.'}];
  if(f.pw)return s.concat([{lit:['ram'],dead:['ram'],t:'Power lost before the flush',d:'RAM is [[volatile]]. The buffered photo disappears, and the file may be empty or missing after restart. This is why programs that care (databases, editors) force the data to storage and wait for confirmation before saying "saved" (the [[durability]] promise).'}]);

 ]})}};

DEMOS.pipeline={note:'Eight instructions through a 5-stage pipeline: F fetch, D decode, X execute, M memory, W write back. The 4th is a branch that jumps. Compare with no overlap, and with a wrong guess.',
mount(r){
  r.innerHTML=`<div class="row"><button class="btn" data-m="no" type="button">No overlap</button><button class="btn" data-m="yes" type="button">Pipelined, guess right</button><button class="btn" data-m="bad" type="button">Pipelined, guess wrong</button></div><div class="scroll"><table class="tbl" id="gr"></table></div><div class="row" id="st"></div><div class="msg" id="nt"></div>`;
  let mode='yes';const S=['F','D','X','M','W'],N=8,B=3;
  const draw=()=>{
    $$(r,'[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===mode));
    const rows=[];
    if(mode==='no'){for(let i=0;i<N;i++)rows.push({n:`I${i+1}${i===B?' (branch)':''}`,start:i*5,st:S,flush:false})}
    else{
      for(let i=0;i<=B;i++)rows.push({n:`I${i+1}${i===B?' (branch)':''}`,start:i,st:S});
      let nextStart=B+1;
      if(mode==='bad'){rows.push({n:'wrong path A',start:B+1,st:['F','D'],flush:true});rows.push({n:'wrong path B',start:B+2,st:['F'],flush:true});nextStart=B+3}
      for(let i=B+1;i<N;i++){rows.push({n:`I${i+1}`,start:nextStart+(i-B-1),st:S})}
    }
    const total=Math.max(...rows.map(x=>x.start+x.st.length));
    let h='<tr><th>instruction</th>'+Array.from({length:total},(_,c)=>`<th>${c+1}</th>`).join('')+'</tr>';
    rows.forEach(x=>{h+=`<tr><td>${x.n}</td>`+Array.from({length:total},(_,c)=>{const k=c-x.start;if(k>=0&&k<x.st.length)return `<td class="${x.flush?'':'hl'}" style="${x.flush?'background:var(--bad-bg);color:var(--bad)':''}">${x.flush?'✗':x.st[k]}</td>`;return '<td></td>'}).join('')+'</tr>'});
    $(r,'#gr').innerHTML=h;
    $(r,'#st').innerHTML=`<span class="pill sig">8 instructions took ${total} cycles</span><span class="pill">${(total/N).toFixed(2)} cycles per instruction</span>`;
    $(r,'#nt').textContent=mode==='no'?'Each instruction waits for the previous one to finish completely: 5 cycles each.':(mode==='yes'?'After the first four cycles of start-up, one instruction finishes every cycle. The branch was guessed right, so the right instructions were already on the line.':'The CPU guessed the wrong path. Two wrongly fetched instructions (red) are discarded and the correct one starts late. Real penalties are often larger than this.');
    $(r,'#nt').className='msg '+(mode==='bad'?'bad':'');
  };
  $$(r,'[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});draw();
}};

  r.innerHTML=`<div class="row"><label><input type="checkbox" id="jn" checked> File system keeps a journal</label><label>Power fails after step <select id="cp"></select></label><button class="btn pri" id="go" type="button">Save and crash</button></div><div class="log" id="lg"></div><div class="msg" id="rs"></div>`;
  const steps=()=>$(r,'#jn').checked?['Journal: write the plan','Journal: write COMMIT',...REAL.map(x=>'Real: '+x)]:REAL.map(x=>'Real: '+x);

      else if(c<5){lg.push('Restart: read journal. The plan has a COMMIT mark, so replay it from the start.');['Mark block 9 as used','Write the data into block 9','Add the name to the folder'].forEach(x=>lg.push('Replay: '+x));msg='<b>Recovered.</b> The committed save was finished during recovery. It took seconds, not a full-disk scan.';cls='good'}

/* ---- huffman ---- */
function huff(text){
  const f={};for(const c of text)f[c]=(f[c]||0)+1;
  let nodes=Object.keys(f).map(c=>({c,w:f[c]}));
  if(nodes.length===0)return {codes:{},f};
  if(nodes.length===1){return {codes:{[nodes[0].c]:'0'},f}}
  let id=0;nodes.forEach(n=>n.id=id++);
  while(nodes.length>1){nodes.sort((a,b)=>a.w-b.w||a.id-b.id);const a=nodes.shift(),b=nodes.shift();nodes.push({w:a.w+b.w,l:a,r:b,id:id++})}
  const codes={};(function walk(n,p){if(n.c!==undefined){codes[n.c]=p;return}walk(n.l,p+'0');walk(n.r,p+'1')})(nodes[0],'');
  return {codes,f};
}

let ROUTE_TOKEN=0;
function tween(g,pts,ms,tk){
  return new Promise(res=>{
    const seg=[];let tot=0;for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(d);tot+=d}
    const t0=performance.now();
    const f=t=>{
      if(tk!==ROUTE_TOKEN){res();return}
      const p=Math.min(1,(t-t0)/ms);let d=p*tot,i=0;while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++}
      const a=pts[i],b=pts[i+1],u=seg[i]?Math.min(1,d/seg[i]):1;
      g.setAttribute('transform',`translate(${a[0]+(b[0]-a[0])*u},${a[1]+(b[1]-a[1])*u})`);
      if(p<1)requestAnimationFrame(f);else res();
    };requestAnimationFrame(f);
  });
}

const LIB = {};           // built chips: name -> {name, ins, outs, design}
const NANDPINS = {ins:['a','b'],outs:['out']};
function partPins(type){
  if(type==='NAND') return NANDPINS;
  if(type==='HIGH') return {ins:[],outs:['out']};
  const c=LIB[type]; return c?{ins:c.ins,outs:c.outs}:{ins:[],outs:[]};
}
function labLevel(d,path,nodes,alias){
  const byId={};d.parts.forEach(p=>byId[p.id]=p);
  const outSymOf=(p,pin)=>p.type==='IN'?'i:'+path+p.name:p.type==='HIGH'?'c1':p.type==='NAND'?'n:'+path+p.id:'o:'+path+p.id+'.'+pin;
  const srcSym=(id,pin)=>{const w=d.wires.find(w=>w.to.p===id&&w.to.pin===pin);if(!w||!byId[w.from.p])return 'c0';return outSymOf(byId[w.from.p],w.from.pin)};
  const lamps={};
  for(const p of d.parts){
    if(p.type==='NAND') nodes['n:'+path+p.id]=[srcSym(p.id,'a'),srcSym(p.id,'b')];
    else if(p.type==='OUT') lamps[p.name]=srcSym(p.id,'in');
    else if(LIB[p.type]){
      const c=LIB[p.type],sub=path+p.id+'/';
      c.ins.forEach(n=>alias['i:'+sub+n]=srcSym(p.id,n));
      const l=labLevel(c.design,sub,nodes,alias);
      c.outs.forEach(n=>alias['o:'+path+p.id+'.'+n]=l[n]||'c0');
    }
  }
  return lamps;
}
function makeSim(design){
  const nodes={},alias={};
  const lamps=labLevel(design,'',nodes,alias);
  const resolve=s=>{let g=0;while(alias[s]!==undefined&&g++<500)s=alias[s];return alias[s]!==undefined?'c0':s};
  const ids=Object.keys(nodes),A=ids.map(s=>resolve(nodes[s][0])),B=ids.map(s=>resolve(nodes[s][1]));
  const vals={},inputs={};ids.forEach(s=>vals[s]=0);
  const val=s=>s==='c1'?1:s==='c0'?0:s[0]==='i'?(inputs[s.slice(2)]?1:0):vals[s];
  const sim={ids,vals,inputs,unstable:false,
    set(o){Object.assign(inputs,o)},
    settle(){let pass=0,ch=true;while(ch&&pass++<200){ch=false;for(let k=0;k<ids.length;k++){const nv=(val(A[k])&&val(B[k]))?0:1;if(vals[ids[k]]!==nv){vals[ids[k]]=nv;ch=true}}}sim.unstable=ch;return sim},
    lamp(name){return val(resolve(lamps[name]||'c0'))},
    pin(partId,type,pin,name){ // value on an output pin of a top-level part
      if(type==='IN')return inputs[name]?1:0;if(type==='HIGH')return 1;if(type==='NAND')return vals['n:'+partId];return val(resolve('o:'+partId+'.'+pin))},
    src(partId,pin){const w=design.wires.find(w=>w.to.p===partId&&w.to.pin===pin);return w},
    count:ids.length};
  return sim;
}

/* ---- build a design object from the compact solution notation, with auto layout ---- */
function designFromSpec(p){
  const parts=[],wires=[];
  p.ins.forEach((n,i)=>parts.push({id:'in:'+n,type:'IN',name:n,x:14,y:18+i*54}));
  p.outs.forEach((n,i)=>parts.push({id:'out:'+n,type:'OUT',name:n,x:LAB_W-92,y:18+i*54}));
  if(!p.sol)return {parts,wires};
  const ref=(s,role)=>{if(s.includes('.')){const [a,b]=s.split('.');return {p:a,pin:b}}return role==='from'?{p:'in:'+s,pin:'out'}:{p:'out:'+s,pin:'in'}};
  p.sol.wires.forEach((w,k)=>{const [a,b]=w.split('>');wires.push({id:'w'+k,from:ref(a,'from'),to:ref(b,'to')})});
  const internal=p.sol.parts.map(([id,type])=>({id,type,x:0,y:0}));
  // depth by longest path from inputs, ignoring back edges
  const depth={};internal.forEach(q=>depth[q.id]=1);
  for(let it=0;it<internal.length+2;it++)wires.forEach(w=>{if(depth[w.from.p]!==undefined&&depth[w.to.p]!==undefined&&w.from.p!==w.to.p&&depth[w.from.p]+1>depth[w.to.p]&&depth[w.from.p]<internal.length+1)depth[w.to.p]=Math.min(depth[w.from.p]+1,internal.length+1)});
  const cols={};internal.forEach(q=>{(cols[depth[q.id]]=cols[depth[q.id]]||[]).push(q)});
  const nc=Math.max(...Object.keys(cols).map(Number));
  const gap=(LAB_W-92-14-120-130)/Math.max(1,nc);
  Object.keys(cols).forEach(c=>{cols[c].forEach((q,i)=>{q.x=130+(c-1)*Math.min(gap+0,170);q.y=18+i*95})});
  return {parts:parts.concat(internal),wires};
}

function runPuzzleTests(p,design){
  const res={rows:[],pass:true,note:''};
  const sim=makeSim(design);
  if(sim.count===0&&!design.parts.some(q=>q.type!=='IN'&&q.type!=='OUT')){res.pass=false;res.note='The canvas has no parts yet. Drag a NAND gate in and wire it up.';return res}
  if(p.seq){
    sim.set(Object.fromEntries(p.ins.map(n=>[n,1])));sim.settle();
    p.seq.forEach((s,i)=>{sim.set(s.set);sim.settle();const got={};let ok=true;for(const k in s.expect){got[k]=sim.lamp(k);if(got[k]!==s.expect[k])ok=false}
      const checks=Object.keys(s.expect).length>0;res.rows.push({inputs:s.set,expect:s.expect,got,ok,say:s.say||'',checks});if(!ok)res.pass=false});
  }else{
    const n=p.ins.length;for(let c=0;c<(1<<n);c++){const inp={};p.ins.forEach((k,i)=>inp[k]=(c>>i)&1);const exp=p.f(inp);sim.set(inp);sim.settle();
      const got={};let ok=true;p.outs.forEach(k=>{got[k]=sim.lamp(k);if(got[k]!==exp[k])ok=false});res.rows.push({inputs:inp,expect:exp,got,ok,checks:true});if(!ok)res.pass=false}
  }
  if(sim.unstable){res.pass=false;res.note='The circuit never settles (a loop that keeps flipping). Check your feedback wiring.'}
  return res;
}
